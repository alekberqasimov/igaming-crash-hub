name: Apply Rush V2.1

on:
  push:
    paths:
      - '.github/rush_apply_trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply selectable V2.1 risk models
        shell: bash
        run: |
          set -euo pipefail
          cat .github/rush_payload_*.txt | base64 -d > /tmp/rush-v2-1.tar.xz
          mkdir -p /tmp/rush-v2-1
          tar -xJf /tmp/rush-v2-1.tar.xz -C /tmp/rush-v2-1

          mkdir -p games/camel-rush games/horse-rush games/Greyhound-Rush games/sonic-rush
          cp /tmp/rush-v2-1/camel-rush/index.html games/camel-rush/index.html
          cp /tmp/rush-v2-1/camel-rush/admin.html games/camel-rush/admin.html
          cp /tmp/rush-v2-1/camel-rush/hub.json games/camel-rush/hub.json
          cp /tmp/rush-v2-1/camel-rush/README.md games/camel-rush/README.md

          cp /tmp/rush-v2-1/horse-rush/index.html games/horse-rush/index.html
          cp /tmp/rush-v2-1/horse-rush/admin.html games/horse-rush/admin.html
          cp /tmp/rush-v2-1/horse-rush/hub.json games/horse-rush/hub.json
          cp /tmp/rush-v2-1/horse-rush/README.md games/horse-rush/README.md

          cp /tmp/rush-v2-1/greyhound-rush/index.html games/Greyhound-Rush/index.html
          cp /tmp/rush-v2-1/greyhound-rush/admin.html games/Greyhound-Rush/admin.html
          cp /tmp/rush-v2-1/greyhound-rush/hub.json games/Greyhound-Rush/hub.json
          cp /tmp/rush-v2-1/greyhound-rush/README.md games/Greyhound-Rush/README.md

          cp /tmp/rush-v2-1/sonic-rush/index.html games/sonic-rush/index.html
          cp /tmp/rush-v2-1/sonic-rush/admin.html games/sonic-rush/admin.html
          cp /tmp/rush-v2-1/sonic-rush/hub.json games/sonic-rush/hub.json
          cp /tmp/rush-v2-1/sonic-rush/README.md games/sonic-rush/README.md

          rm -f .github/rush_payload_*.txt .github/rush_apply_trigger.txt .github/workflows/apply-rush-v2-1.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Upgrade Rush games to selectable V2.1 risk models'
          git push
