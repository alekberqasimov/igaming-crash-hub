name: Fix Sonic V2.4 Live Simulation
on:
  push:
    paths:
      - '.github/sonic-v24-trigger.txt'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Sonic live simulation reset flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          p=Path('games/sonic-rush/index.html')
          s=p.read_text()
          # Headless mode for Admin: same live-room engine continues while admin page is open.
          s=s.replace("let raf=0,timer=0,roundHistory=[];let auto=", "const HEADLESS=new URLSearchParams(location.search).get('headless')==='1';let raf=0,timer=0,loopTimer=0,roundHistory=[];let auto=",1)
          s=s.replace("function secure(){if(globalThis.crypto?.getRandomValues){const a=new Uint32Array(1);crypto.getRandomValues(a);return(a[0]+1)/4294967297}return Math.random()||Number.EPSILON}", "function secure(){if(globalThis.crypto?.getRandomValues){const a=new Uint32Array(1);crypto.getRandomValues(a);return(a[0]+1)/4294967297}return Math.random()||Number.EPSILON}function scheduleLoop(fn){if(HEADLESS){clearTimeout(loopTimer);loopTimer=setTimeout(fn,80)}else{raf=requestAnimationFrame(fn)}}",1)
          old_max="function maxAllowedStake(){const snap=riskSnapshot();let mult=config.treasuryStakeMultipliers[snap.zone.toLowerCase()]??1;let m=config.maxBet*mult;const roundHead=Math.max(0,config.maxPayoutPerRound-finance.openExposure);const sessionHead=Math.max(0,config.maxSessionExposure-finance.openExposure);m=Math.min(m,config.maxPayoutPerBet/config.maxMultiplier,roundHead/config.maxMultiplier,sessionHead/config.maxMultiplier);if(config.liabilityCoverageEnabled){const critical=Math.max(.01,config.riskThresholds.criticalCoverage);const liabilityHead=Math.max(0,snap.availableLiquidity/critical-finance.openExposure);m=Math.min(m,liabilityHead/config.maxMultiplier)}return Math.max(0,Math.floor(m*100)/100)}"
          new_max=old_max+"function botStakeCap(target,cfg=(world&&world.cfg)||config){target=Math.max(1.01,Number(target)||1.01);const snap=riskSnapshot(cfg);let mult=cfg.treasuryStakeMultipliers[snap.zone.toLowerCase()]??1,m=cfg.maxBet*mult;const roundHead=Math.max(0,cfg.maxPayoutPerRound-finance.openExposure),sessionHead=Math.max(0,cfg.maxSessionExposure-finance.openExposure);m=Math.min(m,cfg.maxPayoutPerBet/target,roundHead/target,sessionHead/target);if(cfg.liabilityCoverageEnabled){const critical=Math.max(.01,cfg.riskThresholds.criticalCoverage),liabilityHead=Math.max(0,snap.availableLiquidity/critical-finance.openExposure);m=Math.min(m,liabilityHead/target)}return Math.max(0,Math.floor(m*100)/100)}"
          if old_max not in s: raise SystemExit('maxAllowedStake pattern missing')
          s=s.replace(old_max,new_max,1)
          seed_re=re.compile(r"function seedRoom\(\)\{.*?\}function renderFeed",re.S)
          new_seed="""function seedRoom(){world.simBets=[];world.roomStake=0;world.roomPaid=0;const cfg=world.cfg||config,count=24+Math.floor(secure()*37);let accepted=0;const addBet=(i,target,st)=>{const liability=st*target,nextExposure=finance.openExposure+liability,liquidityAfter=finance.houseCash+finance.reserveBalance*cfg.usableReservePct+st;if(nextExposure>cfg.maxPayoutPerRound||nextExposure>cfg.maxSessionExposure)return false;if(cfg.liabilityCoverageEnabled){const critical=Math.max(.01,cfg.riskThresholds.criticalCoverage);if(liquidityAfter/Math.max(1,nextExposure)<critical)return false}finance.openExposure=nextExposure;world.simBets.push({name:playerNames(i+world.id),stake:st,target,liability,settled:false,payout:0});world.roomStake+=st;metrics.roomStake+=st;accepted++;acceptStake(st,false);return true};for(let i=0;i<count;i++){const snap=riskSnapshot(cfg),targets=snap.pressure>=.7?[1.05,1.08,1.10,1.12,1.18,1.25,1.35]:snap.pressure>=.4?[1.05,1.10,1.15,1.20,1.30,1.50,1.80,2.00]:[1.05,1.10,1.20,1.30,1.50,1.80,2,2.5,3,5,8],target=targets[Math.floor(secure()*targets.length)];let st=[1,2,5,10,10,20,25,50,100][Math.floor(secure()*9)];const cap=botStakeCap(target,cfg);if(cap<cfg.minBet)continue;st=Math.min(st,cap);if(st<cfg.minBet)continue;addBet(i,target,st)}if(accepted===0){for(let j=0;j<8;j++){const target=1.05+(.02*(j%4)),cap=botStakeCap(target,cfg);if(cap<cfg.minBet)break;const st=Math.min(cap,Math.max(cfg.minBet,Math.min(5,cfg.maxBet)));if(st<cfg.minBet)break;if(!addBet(100+j,target,st))break}}$('[data-live-count]').textContent=accepted;renderFeed('waiting');saveState()}function renderFeed"""
          s,n=seed_re.subn(new_seed,s,count=1)
          if n!=1: raise SystemExit('seedRoom patch failed')
          s=s.replace("function newRound(){cancelAnimationFrame(raf);clearTimeout(timer);", "function newRound(){cancelAnimationFrame(raf);clearTimeout(timer);clearTimeout(loopTimer);",1)
          s=s.replace("raf=requestAnimationFrame(bettingTick)","scheduleLoop(bettingTick)")
          s=s.replace("raf=requestAnimationFrame(raceTick)","scheduleLoop(raceTick)")
          old_listener="window.addEventListener('storage',e=>{if(e.key===KEY.reset){config=norm(load(KEY.config,DEF));finance=load(KEY.finance,{houseCash:config.houseInitialCash,reserveBalance:config.reserveTargetAmount,reserveTarget:config.reserveTargetAmount,totalStake:0,totalPayout:0,rounds:0,openExposure:0,reserveUsed:0,reserveRestored:0});metrics=load(KEY.metrics,metrics);wallet=load(KEY.wallet,wallet);logs=load(KEY.logs,[]);roundHistory=[];stopAuto('Reset');newRound()}});"
          new_listener="window.addEventListener('storage',e=>{if(e.key===KEY.reset){cancelAnimationFrame(raf);clearTimeout(timer);clearTimeout(loopTimer);config=norm(load(KEY.config,DEF));finance=load(KEY.finance,{houseCash:config.houseInitialCash,reserveBalance:config.reserveTargetAmount,reserveTarget:config.reserveTargetAmount,totalStake:0,totalPayout:0,rounds:0,openExposure:0,reserveUsed:0,reserveRestored:0});finance.openExposure=0;metrics=load(KEY.metrics,{userBets:0,userWins:0,userLosses:0,userStake:0,userPayout:0,roomStake:0,roomPayout:0});wallet=load(KEY.wallet,{balance:1000});logs=load(KEY.logs,[]);roundHistory=[];stopAuto('Reset');setTimeout(newRound,60)}});"
          if old_listener not in s: raise SystemExit('reset listener pattern missing')
          s=s.replace(old_listener,new_listener,1)
          p.write_text(s)

          # Admin runs a hidden headless copy of the SAME player live-room engine.
          p=Path('games/sonic-rush/admin.html'); a=p.read_text()
          iframe='<iframe data-live-engine src="index.html?headless=1" title="Live demo engine" aria-hidden="true" tabindex="-1" style="position:fixed;left:-4px;bottom:-4px;width:2px;height:2px;border:0;opacity:.001;pointer-events:none;z-index:-1"></iframe>'
          if 'data-live-engine' not in a:
              a=a.replace('<div class="toast" data-toast></div>', '<div class="toast" data-toast></div>'+iframe,1)
          # React immediately to finance writes from other tabs/iframe in addition to polling.
          marker="const unlockAdmin=()=>{"
          if "window.addEventListener('storage',e=>{if([KEY.finance,KEY.metrics,KEY.logs,KEY.config].includes(e.key))render()});" not in a:
              a=a.replace(marker,"window.addEventListener('storage',e=>{if([KEY.finance,KEY.metrics,KEY.logs,KEY.config].includes(e.key))render()});"+marker,1)
          p.write_text(a)

          # Update metadata only; no visual changes.
          hp=Path('games/sonic-rush/hub.json'); h=json.loads(hp.read_text());h['version']='2.4';h['description']='Sonic Rush V2.4 with persistent live demo simulation, reset-safe treasury flow, and selectable Liability Coverage risk model.';h['tags']=[x for x in h.get('tags',[]) if not str(x).startswith('V2.')]+['V2.4'];hp.write_text(json.dumps(h,ensure_ascii=False,indent=2)+'\n')
          rp=Path('games/sonic-rush/README.md'); r=rp.read_text();r+='\n## V2.4 Reset / Live Simulation Fix\n- Reset clears demo finance but immediately restarts the live-room simulation.\n- Admin keeps the same live demo engine running in headless mode, so House Cash / Payout / Profit / Reserve continue changing while Admin is open.\n- Simulated-player stake capacity is target-specific, preventing a zero-player deadlock after reset.\n- Player Live Room again shows simulated winners and losers after reset.\n- No visual/animation redesign in this patch.\n';rp.write_text(r)
          PY
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          for f in ['games/sonic-rush/index.html','games/sonic-rush/admin.html']:
            scripts=re.findall(r'<script[^>]*>(.*?)</script>',Path(f).read_text(),re.S|re.I)
            for i,js in enumerate(scripts):
              q=Path('/tmp')/f'sonic_{i}.js';q.write_text(js)
              r=subprocess.run(['node','--check',str(q)],capture_output=True,text=True)
              if r.returncode:
                print(f,r.stderr);raise SystemExit(1)
          PY
      - name: Package
        run: |
          mkdir -p sonic-v24
          (cd games/sonic-rush && zip -q ../../sonic-v24/Sonic_Rush_V2_4_GitHub.zip index.html admin.html hub.json README.md)
      - uses: actions/upload-artifact@v4
        with:
          name: Sonic-Rush-V2.4
          path: sonic-v24/Sonic_Rush_V2_4_GitHub.zip
          retention-days: 30
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/sonic-rush
          git commit -m 'Sonic V2.4: keep live simulation running after reset and in admin'
          git push
