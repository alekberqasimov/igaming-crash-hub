name: Sonic v1.3 Timeline Patch
on:
  push:
    branches: [main]
    paths: ['.sonic-v13-trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sonic-global-timeline-v13
          fetch-depth: 0
      - name: Patch Sonic engine
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('games/sonic-rush/index.html')
          s=p.read_text()
          old="world={id:world.id+1,state:'BETTING',bettingEnds:now()+10000,bust:1,cfg:clone(config),startAt:0,current:1,simBets:[],userBet:null,roomPaid:0,roomStake:0}"
          new="world={id:world.id+1,state:'BETTING',bettingEnds:now()+10000,countdownEnds:0,bust:1,cfg:clone(config),startAt:0,current:1,simBets:[],userBet:null,roomPaid:0,roomStake:0}"
          if old in s: s=s.replace(old,new,1)
          old="setWorldState('COUNTDOWN');$('[data-bet-window]').hidden=true;const sharedBust=window.IGCHSonicRoom?.takeAuthoritativeBust?.();"
          new="setWorldState('COUNTDOWN');world.countdownEnds=now()+world.cfg.countdownMs;$('[data-bet-window]').hidden=true;const sharedBust=window.IGCHSonicRoom?.takeAuthoritativeBust?.();"
          if old in s: s=s.replace(old,new,1)
          old="function startRace(){setWorldState('RUNNING');world.startAt=now();"
          new="function startRace(){setWorldState('RUNNING');world.startAt=world.countdownEnds||now();"
          if old in s: s=s.replace(old,new,1)
          old="roundHistory.push(world.bust);if(roundHistory.length>40)roundHistory.shift();renderHistory();"
          new="roundHistory.push(world.bust);if(roundHistory.length>40)roundHistory.shift();renderHistory();window.dispatchEvent(new CustomEvent('igch:sonic:round-finished',{detail:{roundId:world.id,bust:world.bust,startedAt:world.startAt,endedAt:now()}}));"
          if old in s: s=s.replace(old,new,1)
          old="window.IGCHSonicEngineV12={generateBust:()=>bust(world.cfg),getState:()=>world.state,getUserBet:()=>world.userBet,getSimBets:()=>world.simBets.map(b=>({name:b.name,stake:b.stake,target:b.target})),refreshFeed:()=>renderFeed(world.state==='SETTLED'?'done':world.state==='RUNNING'?'live':'waiting')};"
          new="""window.IGCHSonicEngineV13={generateBust:()=>bust(world.cfg),getState:()=>world.state,getUserBet:()=>world.userBet,getSimBets:()=>world.simBets.map(b=>({name:b.name,stake:b.stake,target:b.target})),refreshFeed:()=>renderFeed(world.state==='SETTLED'?'done':world.state==='RUNNING'?'live':'waiting'),getTimeline:()=>({roundId:world.id,state:world.state,bettingEnds:world.bettingEnds||0,countdownEnds:world.countdownEnds||0,startAt:world.startAt||0,bust:world.bust,current:world.current,growthRate:world.cfg.growthRate,animationSpeed:world.cfg.animationSpeed}),applyTimeline:t=>{if(!t||!t.state)return;cancelAnimationFrame(raf);clearTimeout(timer);const same=Number(t.roundId)===Number(world.id);world.id=Number(t.roundId)||world.id;world.bettingEnds=Number(t.bettingEnds)||0;world.countdownEnds=Number(t.countdownEnds)||0;world.startAt=Number(t.startAt)||0;world.bust=Number(t.bust)||world.bust;world.current=Number(t.current)||1;if(!same)world.userBet=null;if(t.state==='BETTING'){setWorldState('BETTING');$('[data-result]').hidden=true;$('[data-bet-window]').hidden=false;bettingTick();return}if(t.state==='COUNTDOWN'){setWorldState('COUNTDOWN');$('[data-bet-window]').hidden=true;const left=Math.max(0,world.countdownEnds-now());if(left<=0){startRace();return}const cd=$('[data-countdown]');cd.textContent=Math.max(1,Math.ceil(left/(world.cfg.countdownMs/4)));cd.classList.add('show');timer=setTimeout(startRace,left);return}if(t.state==='RUNNING'){setWorldState('RUNNING');$('[data-bet-window]').hidden=true;$('[data-result]').hidden=true;if(!world.startAt)world.startAt=now();raceTick();return}if(t.state==='SETTLED'){setWorldState('SETTLED');world.current=world.bust;$('[data-mult]').textContent=world.bust.toFixed(2)+'x';$('[data-result]').hidden=false;$('[data-result-main]').textContent=world.bust.toFixed(2)+'x';return}}};window.IGCHSonicEngineV12=window.IGCHSonicEngineV13;"""
          if old not in s:
              if 'window.IGCHSonicEngineV13=' not in s: raise SystemExit('engine marker missing')
          else: s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch to feature branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/sonic-rush/index.html
          if git diff --cached --quiet; then echo 'Already patched'; exit 0; fi
          git commit -m 'Sync Sonic timeline engine and round history events'
          git push origin HEAD:feature/sonic-global-timeline-v13
