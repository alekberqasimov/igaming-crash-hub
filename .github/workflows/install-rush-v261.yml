name: Install Rush V2.6.1 History and Admin Themes
'on':
  push:
    paths:
      - '.github/install-rush-v261-trigger.txt'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install persistent history and player-matched admin themes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          games=['camel-rush','horse-rush','Greyhound-Rush','sonic-rush']
          for g in games:
              d=Path('games')/g
              idx=d/'index.html'; adm=d/'admin.html'
              s=idx.read_text()
              if 'history-sync-v26.js' not in s:
                  s=s.replace('</body>','<script src="history-sync-v26.js?v=2.6.1"></script></body>',1)
                  idx.write_text(s)
              a=adm.read_text()
              if 'admin-theme.css' not in a:
                  a=a.replace('</head>','<link rel="stylesheet" href="admin-theme.css?v=2.6.1"></head>',1)
              if 'history-sync-v26.js' not in a:
                  a=a.replace('</body>','<script src="history-sync-v26.js?v=2.6.1"></script></body>',1)
              adm.write_text(a)
              hub=d/'hub.json'
              if hub.exists():
                  import json
                  x=json.loads(hub.read_text()); x['version']='2.6.1'; hub.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add games
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rush V2.6.1: persistent history and player-matched admin themes"
          git push
