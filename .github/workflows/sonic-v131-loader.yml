name: Sonic v1.3.1 Loader Patch
on:
  push:
    branches: [main]
    paths: ['.sonic-v131-trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sonic-responsive-room-v131
          fetch-depth: 0
      - name: Patch Sonic loader
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/../igaming-crash-hub/.sonic-v131-trigger" ] && [ ! -f ".sonic-v131-trigger" ]; then
            echo "Trigger removed; nothing to do"
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('games/sonic-rush/index.html')
          s=p.read_text()
          if 'player-hub-link-v217.js?v=2.17.0' not in s:
              if 'player-hub-link-v216.js?v=2.16.0' in s:
                  s=s.replace('player-hub-link-v216.js?v=2.16.0','player-hub-link-v217.js?v=2.17.0',1)
              elif 'player-hub-link-v216.js?v=2.16' in s:
                  s=s.replace('player-hub-link-v216.js?v=2.16','player-hub-link-v217.js?v=2.17.0',1)
              else:
                  raise SystemExit('Sonic loader marker missing')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/sonic-rush/index.html
          if git diff --cached --quiet; then echo 'Already patched'; exit 0; fi
          git commit -m 'Load Sonic responsive room UI v1.3.1'
          git push origin HEAD:fix/sonic-responsive-room-v131
