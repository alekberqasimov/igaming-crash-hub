name: Live Room Real Player Full Scroll V2
on:
  push:
    paths:
      - '.github/live-room-v2-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets={'games/sonic-rush/index.html':'sonic','games/horse-rush/index.html':'race','games/Greyhound-Rush/index.html':'race'}
          css='''<style id="igch-live-room-real-player-v1">[data-feed]{max-height:248px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;align-content:start}[data-feed] .igch-real-player{grid-column:1/-1;position:sticky;top:0;z-index:6;background:rgba(25,215,255,.10);border-top:1px solid rgba(25,215,255,.28);border-bottom:1px solid rgba(25,215,255,.28)}[data-feed] .igch-real-badge{display:inline-block;margin-left:5px;padding:2px 5px;border:1px solid rgba(66,229,143,.32);border-radius:999px;background:rgba(66,229,143,.10);color:var(--green,#42e58f);font-size:6px;font-style:normal;font-weight:1000}@media(max-width:720px){[data-feed]{max-height:220px}}</style>'''
          D='$'
          def render(kind):
              sm=D+'{b.stake.toFixed(0)} AZN' if kind=='sonic' else D+'{b.stake.toFixed(0)} · '+D+'{b.target.toFixed(2)}x'
              rm=D+'{Number(real.stake||0).toFixed(0)} AZN' if kind=='sonic' else D+'{Number(real.stake||0).toFixed(0)}'+D+"{real.autoCashout?' · '+Number(real.autoCashout).toFixed(2)+'x':''}"
              sw='`'+D+'{b.target.toFixed(2)}x`' if kind=='sonic' else "'WON'"
              rw="real.cashout?Number(real.cashout).toFixed(2)+'x':'WON'" if kind=='sonic' else "'WON'"
              x='''function renderFeed(mode){const e=$('[data-feed]');const arr=world.simBets;const esc=v=>String(v==null?'':v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));let rows=arr.map(b=>{let state='—',cls='';if((mode==='live'||mode==='done')&&b.settled){state=b.payout>0?__SW__:'LOST';cls=b.payout>0?'win':'loss'}return`<div class="feed-row" data-source="SIM"><b>__SN__</b><span>__SM__</span><strong class="__CL__">__ST__</strong></div>`}).join('');const real=world.userBet;if(real){const profile=window.IGCHPlayer&&typeof window.IGCHPlayer.getProfile==='function'?window.IGCHPlayer.getProfile():null;const realName=profile&&profile.nickname?profile.nickname:'YOU';const realId=profile&&profile.id?profile.id:'REAL';let state='—',cls='';if(real.settled&&Number(real.payout)>0){state=__RW__;cls='win'}else if(mode==='done'||world.state==='SETTLED'){state='LOST';cls='loss'}rows=`<div class="feed-row igch-real-player" data-source="REAL" data-player-id="__RID__"><b>__RN__<em class="igch-real-badge">REAL</em></b><span>__RM__</span><strong class="__CL__">__ST__</strong></div>`+rows;}e.innerHTML=rows;const lc=$('[data-live-count]');if(lc)lc.textContent=arr.length+(real?1:0)}\n'''
              for a,b in {'__SW__':sw,'__RW__':rw,'__SN__':D+'{esc(b.name)}','__SM__':sm,'__RM__':rm,'__RID__':D+'{esc(realId)}','__RN__':D+'{esc(realName)}','__CL__':D+'{cls}','__ST__':D+'{state}'}.items(): x=x.replace(a,b)
              return x
          for f,k in targets.items():
              p=Path(f);s=p.read_text(encoding='utf-8');a=s.find('function renderFeed(mode){');b=s.find('function settleSim',a)
              if a<0 or b<0: raise SystemExit('feed markers missing '+f)
              s=s[:a]+render(k)+s[b:]
              if 'igch-live-room-real-player-v1' not in s:
                  h=s.lower().find('</head>')
                  if h<0: raise SystemExit('head marker missing '+f)
                  s=s[:h]+css+'\n'+s[h:]
              if "acceptStake(stake,true);renderFeed('waiting');" not in s:s=s.replace("acceptStake(stake,true);toast","acceptStake(stake,true);renderFeed('waiting');toast")
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/sonic-rush/index.html games/horse-rush/index.html games/Greyhound-Rush/index.html
          git diff --cached --quiet || (git commit -m 'Live rooms: real player plus full scrollable list' && git push)