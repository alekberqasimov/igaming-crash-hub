name: Crash Explanation Audit V2.10
on:
  push:
    paths:
      - '.github/crash-explanation-audit-v210-trigger.txt'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply code-accurate explanations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          rush=['camel-rush','horse-rush','Greyhound-Rush','sonic-rush']
          EN_OLD='Player outcomes are never changed by treasury status. Limits control exposure.'
          AZ_OLD='Xəzinə vəziyyəti oyunçu nəticəsini dəyişmir. Exposure limitlərlə idarə olunur.'
          RU_OLD='Состояние казны не меняет исход игрока. Экспозиция управляется лимитами.'
          repl={
            EN_OLD:'Treasury V2 can adapt the NEXT round probability profile through Risk Pressure → Effective RTP. The active round remains locked at start; hard exposure limits are separate.',
            AZ_OLD:'Treasury V2 NÖVBƏTİ raundun ehtimal profilini Risk Pressure → Effective RTP vasitəsilə adaptasiya edə bilər. Aktiv raund startda kilidlənir; hard exposure limitləri ayrıca işləyir.',
            RU_OLD:'Treasury V2 может адаптировать вероятностный профиль СЛЕДУЮЩЕГО раунда через Risk Pressure → Effective RTP. Активный раунд фиксируется при старте; hard exposure limits работают отдельно.',
            'Demo fairness: every round outcome is locked before the race. House cash or player history does not change an active outcome.':'Demo rule: each round outcome is locked at start. Treasury V2 may adapt the NEXT round probability profile via Effective RTP; it never rewrites an already active round.',
            'Demo fairness: hər raundun nəticəsi yarışdan əvvəl kilidlənir. House cash və ya oyunçu tarixçəsi aktiv nəticəni dəyişmir.':'Demo qaydası: hər raund startda kilidlənir. Treasury V2 Effective RTP vasitəsilə yalnız NÖVBƏTİ raundun ehtimal profilini adaptasiya edə bilər; aktiv raund yenidən yazılmır.',
            'Демо-честность: исход каждого раунда фиксируется до гонки. House cash или история игрока не меняют активный исход.':'Демо-правило: исход раунда фиксируется при старте. Treasury V2 через Effective RTP может адаптировать только вероятностный профиль СЛЕДУЮЩЕГО раунда; активный раунд не переписывается.'
          }
          for slug in rush:
              admin=Path('games')/slug/'admin.html'
              s=admin.read_text()
              for a,b in repl.items(): s=s.replace(a,b)
              tag='<script src="../shared/rush-admin-info-v29.js?v=2.10"></script>'
              s=re.sub(r'<script src="\.\./shared/rush-admin-info-v29\.js[^>]*></script>','',s,flags=re.I)
              pos=s.lower().rfind('</body>')
              if pos<0: pos=s.lower().rfind('</html>')
              s=(s[:pos]+tag+s[pos:]) if pos>=0 else (s+'\n'+tag+'\n')
              admin.write_text(s)
              idx=Path('games')/slug/'index.html'
              x=idx.read_text()
              for a,b in repl.items(): x=x.replace(a,b)
              idx.write_text(x)

          gp=Path('games/goal-rush/admin-info-v28.js'); g=gp.read_text()
          pairs=[
          ('House Cash üçün mode threshold-dur. Cari House Cash və faktiki margin bu target ilə birlikdə CRITICAL/BUILD/DEFENSIVE/NORMAL mode seçir; mode allowed multiplier target-ləri məhdudlaşdıra bilər.','House Cash üçün rejim threshold-dur və outcome target selection-a real təsir edir. Cari kod: CRITICAL əgər House Cash < Build Target × 25% VƏ YA Reserve < Reserve Capital × 65%; BUILD əgər House Cash < Build Target VƏ YA Actual Margin < Target Margin × 75%; DEFENSIVE əgər House Cash < Build Target × 3 VƏ YA Actual Margin < Target Margin; əks halda NORMAL. Rejim allowed multiplier target-ləri məhdudlaşdırır.'),
          ('Mode-threshold для House Cash. Текущий House Cash и фактическая margin вместе с ним выбирают CRITICAL/BUILD/DEFENSIVE/NORMAL; mode может ограничивать allowed multiplier targets.','Mode-threshold для House Cash, реально влияющий на outcome target selection. Текущий код: CRITICAL если House Cash < Build Target × 25% ИЛИ Reserve < Reserve Capital × 65%; BUILD если House Cash < Build Target ИЛИ Actual Margin < Target Margin × 75%; DEFENSIVE если House Cash < Build Target × 3 ИЛИ Actual Margin < Target Margin; иначе NORMAL. Режим ограничивает allowed multiplier targets.'),
          ('House Cash mode threshold. Current House Cash and actual margin use it to choose CRITICAL/BUILD/DEFENSIVE/NORMAL; the mode can restrict allowed multiplier targets.','House Cash mode threshold that directly affects outcome target selection. Current code: CRITICAL if House Cash < Build Target × 25% OR Reserve < Reserve Capital × 65%; BUILD if House Cash < Build Target OR Actual Margin < Target Margin × 75%; DEFENSIVE if House Cash < Build Target × 3 OR Actual Margin < Target Margin; otherwise NORMAL. The mode restricts allowed multiplier targets.')]
          for a,b in pairs: g=g.replace(a,b)
          gp.write_text(g)

          pp=Path('games/penalty/admin-info-v28.js'); p=pp.read_text()
          for a,b in [
          ('Cari v25.12 modelində accepted bet RNG-ni dəyişmir.','Cari professional modeldə accepted bet RNG-ni dəyişmir.'),
          ('В текущем v25.12 RNG принятой ставки не меняет.','В текущей professional model RNG принятой ставки не меняет.'),
          ('In current v25.12 it does not change accepted-bet RNG.','In the current professional model it does not change accepted-bet RNG.'),
          ('Cari v25.12-də Treasury dashboard üçün target/warning səviyyəsidir. Accepted-round RNG-ni dəyişmir; House Cash aşağı olduqda risk status/hesabatı göstərir.','Cari professional modeldə bu, Treasury dashboard üçün target/warning səviyyəsidir. Accepted-round RNG-ni dəyişmir; House Cash aşağı olduqda status/hesabat reference-i kimi işləyir.'),
          ('В текущем v25.12 это Treasury target/warning level для dashboard. RNG принятого раунда не меняет; показывает risk status при низком House Cash.','В текущей professional model это Treasury target/warning level для dashboard. RNG принятого раунда не меняет; используется как status/reporting reference при низком House Cash.'),
          ('In current v25.12 this is a Treasury target/warning level for the dashboard. It does not change accepted-round RNG; it flags risk status when House Cash is low.','In the current professional model this is a Treasury target/warning level for the dashboard. It does not change accepted-round RNG; it is a status/reporting reference when House Cash is low.'),
          ('["Cash Protection Target"','["Treasury Target / Warning Level"')]: p=p.replace(a,b)
          pp.write_text(p)

          audit=Path('docs/CRASH_ADMIN_EXPLANATION_AUDIT_V2_10.md'); audit.parent.mkdir(parents=True,exist_ok=True)
          audit.write_text('''# Crash Admin Explanation Audit — V2.10\n\nDate: 2026-09-01\n\n## Corrected games\n1. Camel Rush — Treasury V2 + optional Liability Coverage explanations; removed contradictory no-treasury-effect wording; active-round lock clarified.\n2. Horse Rush — same V2/Liability explanation correction.\n3. Greyhound Rush — same V2/Liability explanation correction.\n4. Sonic Rush — same V2/Liability explanation correction.\n5. Goal Rush — Build Cash Target now documents actual CRITICAL/BUILD/DEFENSIVE/NORMAL conditions and outcome-target restriction.\n6. Casino Penalty — removed stale v25.12 wording; Cash Protection info renamed Treasury Target / Warning Level; explicitly preserves its different accepted-round RNG semantics.\n\n## Semantic source of truth\n- Rush V2 family: Treasury state can adapt NEXT-round probability via Risk Pressure -> Effective RTP; active round is immutable once started. Liability OFF uses Treasury V2 base pressure; Liability ON adds Coverage Pressure and coverage-based acceptance protection.\n- Goal Rush: treasury/margin mode selection constrains allowed outcome multiplier targets.\n- Casino Penalty professional model: Treasury/exposure controls acceptance, settlement, reserve and jackpot gating; accepted-round RNG is not steered by treasury balance.\n\n## Player visual scope\nNo animation, scene, layout or game art redesign is part of this audit.\n''')
          PY
      - name: Validate corrected explanations
        shell: bash
        run: |
          set -euo pipefail
          test -f games/shared/rush-admin-info-v29.js
          for f in games/camel-rush/admin.html games/horse-rush/admin.html games/Greyhound-Rush/admin.html games/sonic-rush/admin.html; do grep -q '../shared/rush-admin-info-v29.js?v=2.10' "$f"; done
          grep -q 'CRITICAL if House Cash < Build Target × 25%' games/goal-rush/admin-info-v28.js
          grep -q 'Treasury Target / Warning Level' games/penalty/admin-info-v28.js
          node --check games/shared/rush-admin-info-v29.js
          node --check games/goal-rush/admin-info-v28.js
          node --check games/penalty/admin-info-v28.js
      - name: Commit audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games docs/CRASH_ADMIN_EXPLANATION_AUDIT_V2_10.md
          git commit -m 'Crash V2.10: align Admin explanations with actual game logic'
          git push
