name: Sonic v1.3.4 Repair
on:
  push:
    branches: [main]
    paths: ['.sonic-v134-trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sonic-v134-rtp-history
          fetch-depth: 0
      - name: Patch Sonic player and admin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=['games/sonic-rush/index.html','games/sonic-rush/admin.html']
          for name in files:
              p=Path(name); s=p.read_text()
              s=s.replace('targetProfitMargin:.50,targetRtp:.50,payoutBudgetPct:.50','targetProfitMargin:.07,targetRtp:.93,payoutBudgetPct:.50')
              p.write_text(s)
          p=Path('games/sonic-rush/index.html'); s=p.read_text()
          s=s.replace('history-sync-v26.js?v=2.6.1','history-sync-v27.js?v=2.7.0')
          s=s.replace('../shared/player-hub-link-v219.js?v=2.19.0','../shared/player-hub-link-v220.js?v=2.20.0')
          dup="window.dispatchEvent(new CustomEvent('igch:sonic:round-finished',{detail:{roundId:world.id,bust:world.bust,startedAt:world.startAt,endedAt:now()}}));window.dispatchEvent(new CustomEvent('igch:sonic:round-finished',{detail:{roundId:world.id,bust:world.bust,startedAt:world.startAt,endedAt:now()}}));"
          one="window.dispatchEvent(new CustomEvent('igch:sonic:round-finished',{detail:{roundId:world.id,bust:world.bust,startedAt:world.startAt,endedAt:now()}}));"
          s=s.replace(dup,one)
          p.write_text(s)
          p=Path('games/sonic-rush/admin.html'); s=p.read_text()
          marker='<script src="admin-percent-config-v132.js?v=1.3.2"></script>'
          mig=marker+'\n<script src="../shared/sonic-config-migrate-v134.js?v=1.3.4"></script>'
          if '../shared/sonic-config-migrate-v134.js?v=1.3.4' not in s:
              s=s.replace(marker,mig)
          s=s.replace('history-sync-v26.js?v=2.6.1','history-sync-v27.js?v=2.7.0')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/sonic-rush/index.html games/sonic-rush/admin.html
          git commit -m 'Sonic v1.3.4: fix RTP defaults and canonical history strip'
          git push origin HEAD:fix/sonic-v134-rtp-history
