name: Sonic Crash Best v1.4 QA

on:
  push:
    branches:
      - feature/sonic-crash-best-v14
    paths:
      - 'games/sonic-crash-best/**'
      - '.github/workflows/sonic-crash-best-qa.yml'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check games/sonic-crash-best/core.js
      - name: Canonical core tests
        run: node games/sonic-crash-best/tests/core.test.cjs
