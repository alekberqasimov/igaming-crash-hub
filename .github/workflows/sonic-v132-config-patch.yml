name: Sonic v1.3.2 Config Patch
on:
  push:
    branches: [main]
    paths: ['.sonic-v132-trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sonic-percent-config-v132
          fetch-depth: 0
      - name: Patch Sonic player and admin loaders
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('games/sonic-rush/index.html')
          s=p.read_text()
          old='../shared/player-hub-link-v217.js?v=2.17.0'
          new='../shared/player-hub-link-v218.js?v=2.18.0'
          if new not in s:
              if old not in s: raise SystemExit('player loader marker missing')
              s=s.replace(old,new,1)
          p.write_text(s)

          a=Path('games/sonic-rush/admin.html')
          t=a.read_text()
          oldc='<script src="treasury-clarity-v27.js?v=2.7.1"></script>'
          newc='<script src="treasury-clarity-v28.js?v=2.8.0"></script>'
          if newc not in t:
              if oldc not in t: raise SystemExit('clarity marker missing')
              t=t.replace(oldc,newc,1)
          marker='<script src="../shared/rush-admin-info-v29.js?v=2.10"></script>'
          add=marker+'\n<script src="admin-percent-config-v132.js?v=1.3.2"></script>'
          if 'admin-percent-config-v132.js?v=1.3.2' not in t:
              if marker not in t: raise SystemExit('admin script marker missing')
              t=t.replace(marker,add,1)
          a.write_text(t)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/sonic-rush/index.html games/sonic-rush/admin.html
          if git diff --cached --quiet; then echo 'Already patched'; exit 0; fi
          git commit -m 'Wire Sonic percent config and player config sync v1.3.2'
          git push origin HEAD:fix/sonic-percent-config-v132
