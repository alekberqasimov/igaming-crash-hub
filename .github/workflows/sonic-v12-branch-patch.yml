name: Sonic v1.2 Branch Patch
on:
  push:
    paths:
      - '.github/sonic-v12-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sonic-authoritative-round-sync
      - name: Patch Sonic engine hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('games/sonic-rush/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('../shared/player-hub-link-v214.js?v=2.14.1','../shared/player-hub-link-v215.js?v=2.15.0')
          old="function startCountdown(){setWorldState('COUNTDOWN');$('[data-bet-window]').hidden=true;world.bust=bust(world.cfg);let seq=3;"
          new="function startCountdown(){if(window.IGCHSonicRoom?.shouldWaitForRound?.()){setTimeout(startCountdown,120);return}setWorldState('COUNTDOWN');$('[data-bet-window]').hidden=true;const sharedBust=window.IGCHSonicRoom?.takeAuthoritativeBust?.();world.bust=Number.isFinite(Number(sharedBust))?Number(sharedBust):bust(world.cfg);let seq=3;"
          if old not in s: raise SystemExit('startCountdown marker missing')
          s=s.replace(old,new,1)
          old2="function newRound(){cancelAnimationFrame(raf);clearTimeout(timer);world={id:world.id+1,state:'BETTING',bettingEnds:now()+10000,bust:1,cfg:clone(config),startAt:0,current:1,simBets:[],userBet:null,roomPaid:0,roomStake:0};"
          new2="function newRound(){cancelAnimationFrame(raf);clearTimeout(timer);world={id:world.id+1,state:'BETTING',bettingEnds:now()+10000,bust:1,cfg:clone(config),startAt:0,current:1,simBets:[],userBet:null,roomPaid:0,roomStake:0};window.dispatchEvent(new CustomEvent('igch:sonic:new-round',{detail:{id:world.id}}));"
          if old2 not in s: raise SystemExit('newRound marker missing')
          s=s.replace(old2,new2,1)
          old3="function setWorldState(s){world.state=s;document.body.dataset.state=s;$('[data-state-label]').textContent=s;"
          new3="function setWorldState(s){world.state=s;document.body.dataset.state=s;window.dispatchEvent(new CustomEvent('igch:sonic:state',{detail:{state:s,id:world.id}}));$('[data-state-label]').textContent=s;"
          if old3 not in s: raise SystemExit('setWorldState marker missing')
          s=s.replace(old3,new3,1)
          marker="function tryAutoJoin(){"
          hook="window.IGCHSonicEngineV12={generateBust:()=>bust(world.cfg),getState:()=>world.state,getUserBet:()=>world.userBet,getSimBets:()=>world.simBets.map(b=>({name:b.name,stake:b.stake,target:b.target})),refreshFeed:()=>renderFeed(world.state==='SETTLED'?'done':world.state==='RUNNING'?'live':'waiting')};\n"
          if marker not in s: raise SystemExit('engine hook marker missing')
          s=s.replace(marker,hook+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit branch patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/sonic-rush/index.html
          git diff --cached --quiet || (git commit -m 'Wire Sonic engine to authoritative P2P round sync' && git push origin HEAD:feature/sonic-authoritative-round-sync)
