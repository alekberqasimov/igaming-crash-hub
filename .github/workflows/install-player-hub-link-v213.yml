name: Install Player Hub Link V2.13
on:
  push:
    paths:
      - '.github/player-hub-v213-trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Games Hub link to every Player View
        run: |
          python3 - <<'PY'
          from pathlib import Path
          games=['camel-rush','horse-rush','Greyhound-Rush','sonic-rush','goal-rush','penalty']
          tag='<script src="../shared/player-hub-link-v213.js?v=2.13"></script>'
          for game in games:
              p=Path('games')/game/'index.html'
              s=p.read_text(encoding='utf-8')
              if 'player-hub-link-v213.js' in s:
                  print(game, 'already installed')
                  continue
              low=s.lower()
              pos=low.rfind('</body>')
              if pos>=0:
                  s=s[:pos]+tag+'\n'+s[pos:]
              else:
                  pos=low.rfind('</html>')
                  if pos>=0:s=s[:pos]+tag+'\n'+s[pos:]
                  else:s+='\n'+tag+'\n'
              p.write_text(s,encoding='utf-8')
              print(game, 'installed')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/*/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Player V2.13: add Games Hub navigation to all games'
            git push
          fi