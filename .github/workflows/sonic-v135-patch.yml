name: Sonic v1.3.5 Patch
on:
  push:
    branches: [main]
    paths: ['.sonic-v135-trigger']
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger Sonic v1.3.5 patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sonic-canonical-room-config-v135
          fetch-depth: 0
      - name: Patch Sonic references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('games/sonic-rush/index.html')
          s=p.read_text()
          s=s.replace('../shared/player-hub-link-v220.js?v=2.20.0','../shared/player-hub-link-v221.js?v=2.21.0')
          p.write_text(s)
          p=Path('games/sonic-rush/admin.html')
          s=p.read_text()
          s=s.replace('admin-percent-config-v132.js?v=1.3.2','admin-percent-config-v135.js?v=1.3.5')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/sonic-rush/index.html games/sonic-rush/admin.html
          git diff --cached --quiet || git commit -m 'Sonic v1.3.5: wire canonical room config sync'
          git push origin HEAD:feature/sonic-canonical-room-config-v135
