name: Migrate games into IGAMING CRASH HUB

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-games.yml"
      - "games/.migration-trigger"
  workflow_dispatch:
    inputs:
      force_sync:
        description: "Force re-import from old standalone repositories"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      FORCE_SYNC: ${{ github.event.inputs.force_sync || 'false' }}

    steps:
      - name: Checkout IGAMING CRASH HUB
        uses: actions/checkout@v4

      - name: Import the current game builds
        shell: bash
        run: |
          set -euo pipefail

          if [ -f games/.migration-complete ] && [ "$FORCE_SYNC" != "true" ]; then
            echo "Migration already completed. Nothing to do."
            exit 0
          fi

          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          echo "Cloning current public game repositories..."
          git clone --depth 1 https://github.com/alekberqasimov/igaming-camel-race.git "$TMP/camel"
          git clone --depth 1 https://github.com/alekberqasimov/IGAMING_GOAL_RUSH_ALAKBAR.git "$TMP/goal"
          git clone --depth 1 https://github.com/alekberqasimov/Igaming-Penalty-demo.git "$TMP/penalty"

          rm -rf games/camel-rush games/goal-rush games/penalty
          mkdir -p games/camel-rush games/goal-rush games/penalty

          cp "$TMP/camel/index.html" games/camel-rush/index.html
          cp "$TMP/camel/admin.html" games/camel-rush/admin.html
          cp "$TMP/camel/README.md" games/camel-rush/README.md

          cp "$TMP/goal/index.html" games/goal-rush/index.html
          cp "$TMP/goal/admin.html" games/goal-rush/admin.html
          cp "$TMP/goal/README.md" games/goal-rush/README.md

          cp "$TMP/penalty/index.html" games/penalty/index.html
          cp "$TMP/penalty/admin.html" games/penalty/admin.html
          cp "$TMP/penalty/README.md" games/penalty/README.md

          camel_ver="$(grep -Eo 'v[0-9]+([.][0-9]+)+' "$TMP/camel/README.md" | head -1 || true)"
          goal_ver="$(grep -Eo 'v[0-9]+([.][0-9]+)+' "$TMP/goal/README.md" | head -1 || true)"
          penalty_ver="$(grep -Eo 'v[0-9]+([.][0-9]+)+' "$TMP/penalty/README.md" | head -1 || true)"

          camel_ver="${camel_ver:-v1.9.1}"
          goal_ver="${goal_ver:-v6.4.02}"
          penalty_ver="${penalty_ver:-v25.14}"

          cat > games/camel-rush/hub.json <<EOF
          {
            "name": "Camel Rush",
            "version": "$camel_ver",
            "status": "LIVE DEMO",
            "category": "Race · Crash · Cashout",
            "description": "Always-on desert race with rising multiplier, Auto Play, Auto Cashout and live-room simulation.",
            "tags": ["Crash", "Race", "Cashout"],
            "art": "camel",
            "order": 10
          }
          EOF

          cat > games/goal-rush/hub.json <<EOF
          {
            "name": "Goal Rush",
            "version": "$goal_ver",
            "status": "LIVE DEMO",
            "category": "Football · Run · Cashout",
            "description": "Football-driven progressive cashout experience with manual play, Auto Play and live-result presentation.",
            "tags": ["Football", "Cashout", "Auto Play"],
            "art": "goal",
            "order": 20
          }
          EOF

          cat > games/penalty/hub.json <<EOF
          {
            "name": "Casino Penalty",
            "version": "$penalty_ver",
            "status": "LIVE DEMO",
            "category": "Football · Penalty · Progressive",
            "description": "Penalty-based progressive prototype with player/admin views, treasury controls and multiplier logic.",
            "tags": ["Penalty", "Progressive", "Treasury"],
            "art": "penalty",
            "order": 30
          }
          EOF

          date -u +"Migrated from standalone repositories at %Y-%m-%dT%H:%M:%SZ" > games/.migration-complete

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Migrate current games into Crash Hub [skip ci]"
          git push
