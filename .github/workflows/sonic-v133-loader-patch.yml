name: Sonic v1.3.3 Loader Patch
on:
  push:
    branches: [main]
    paths: ['.sonic-v133-trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sonic-history-roundid-v133
          fetch-depth: 0
      - name: Patch Sonic loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('games/sonic-rush/index.html')
          s=p.read_text()
          old='../shared/player-hub-link-v218.js?v=2.18.0'
          new='../shared/player-hub-link-v219.js?v=2.19.0'
          if new not in s:
              if old not in s:
                  raise SystemExit('Sonic loader marker missing')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/sonic-rush/index.html
          if git diff --cached --quiet; then echo 'Already patched'; exit 0; fi
          git commit -m 'Load Sonic canonical history v1.3.3'
          git push origin HEAD:fix/sonic-history-roundid-v133
