name: Crash Admin Info Audit V2.8
on:
  push:
    paths:
      - '.github/crash-admin-info-v28-trigger.txt'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install code-accurate 3-language info help
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,json

          rush_slugs=['camel-rush','horse-rush','Greyhound-Rush','sonic-rush']
          rush_lang={
            'camel-rush':'camelrushv2lc_lang_v2','horse-rush':'horserushv2lc_lang_v2','Greyhound-Rush':'greyhoundrushv2lc_lang_v2','sonic-rush':'sonicrush_lang_v2'
          }
          rush_info={
          'liabilityCoverageEnabled':{
            'az':['Liability Coverage / Risk Model','ON olduqda Treasury V2-yə real Open Liability və Coverage Ratio əlavə olunur. Coverage risk pressure-a və yeni stake üçün risk-capacity hesabına təsir edir. OFF olduqda coverage bu iki hesabdan çıxır, amma Min/Max Bet, Max Payout/Bet, Max Payout/Round və Session Exposure hard limitləri qalır. Aktiv raund dəyişmir; yeni config növbəti raundda qüvvəyə minir.','ON: açıq liability böyüdükcə müdafiə daha tez güclənir və qəbul edilən risk daralır.','OFF: yalnız Reserve + Margin + Payout Budget feedback qalır; coverage ayrıca pressure yaratmır.'],
            'ru':['Liability Coverage / Risk Model','ON добавляет к Treasury V2 реальные Open Liability и Coverage Ratio. Coverage влияет на risk pressure и расчёт risk-capacity для новой ставки. OFF исключает coverage из этих двух расчётов, но Min/Max Bet, Max Payout/Bet, Max Payout/Round и Session Exposure остаются жёсткими лимитами. Активный раунд не меняется; новый config действует со следующего раунда.','ON: при росте открытой liability защита включается раньше и допустимый риск сужается.','OFF: остаётся feedback Reserve + Margin + Payout Budget; coverage не создаёт отдельный pressure.'],
            'en':['Liability Coverage / Risk Model','When ON, Treasury V2 also uses real Open Liability and Coverage Ratio. Coverage affects risk pressure and the risk-capacity calculation for new stakes. OFF removes coverage from those two calculations, while Min/Max Bet, Max Payout/Bet, Max Payout/Round and Session Exposure remain hard limits. The active round is unchanged; new config applies from the next round.','ON: growing open liability makes protection engage earlier and narrows accepted risk.','OFF: only Reserve + Margin + Payout Budget feedback remains; coverage creates no separate pressure.']},
          'targetProfitMargin':{
            'az':['Target Profit Margin','Uzunmüddətli operator mənfəət hədəfidir, faktiki payout deyil. Sistem Target RTP-ni avtomatik hesablayır: Target RTP = 1 − Target Profit Margin. Məsələn 0.35 = 35% margin və 65% Target RTP. Faktiki nəticə ayrıca Actual Margin və Actual RTP ilə ölçülür.','Artıranda Target RTP azalır; eyni treasury vəziyyətində effective payout profili daha müdafiəkar olur.','Azaldanda Target RTP artır; oyunçu payout-u üçün daha geniş probability sahəsi yaranır.'],
            'ru':['Target Profit Margin','Долгосрочная целевая маржа оператора, а не фактический payout. Target RTP рассчитывается автоматически: Target RTP = 1 − Target Profit Margin. Например 0.35 = 35% margin и 65% Target RTP. Фактический результат отдельно показывается как Actual Margin и Actual RTP.','При увеличении Target RTP снижается; при том же состоянии treasury effective payout profile становится защитнее.','При уменьшении Target RTP растёт; для player payout остаётся больше probability space.'],
            'en':['Target Profit Margin','The long-run operator profit target, not actual payout. Target RTP is derived automatically: Target RTP = 1 − Target Profit Margin. Example: 0.35 means 35% margin and 65% Target RTP. Realized results are shown separately as Actual Margin and Actual RTP.','Increasing it lowers Target RTP and makes the effective payout profile more defensive at the same treasury state.','Decreasing it raises Target RTP and leaves more probability space for player payout.']},
          'payoutBudgetPct':{
            'az':['Payout Budget %','House Cash-in risk modelində payout üçün nəzərə alınan hissəsidir: Payout Budget = House Cash × bu faiz. Bu RTP deyil, ayrıca pul balansı deyil və payout-u birbaşa bloklayan hard cap deyil. Open Exposure bu büdcəni aşdıqca Budget Pressure yüksəlir və Effective RTP aşağı çəkilə bilər.','Artıranda eyni exposure üçün Budget Pressure azalır; model daha az müdafiəkar olur.','Azaldanda Budget Pressure daha tez yüksəlir; model daha tez müdafiəkar olur.'],
            'ru':['Payout Budget %','Доля House Cash, которую risk model считает payout-budget: Payout Budget = House Cash × этот процент. Это не RTP, не отдельный денежный баланс и не жёсткий cap выплаты. Когда Open Exposure превышает этот budget, растёт Budget Pressure и Effective RTP может снижаться.','Увеличение снижает Budget Pressure при той же exposure; модель становится менее защитной.','Уменьшение быстрее повышает Budget Pressure; модель раньше становится защитной.'],
            'en':['Payout Budget %','The share of House Cash treated by the risk model as payout budget: Payout Budget = House Cash × this percentage. It is not RTP, not a separate cash balance, and not a hard payout cap. As Open Exposure exceeds this budget, Budget Pressure rises and Effective RTP can be reduced.','Increasing it lowers Budget Pressure for the same exposure, making the model less defensive.','Decreasing it raises Budget Pressure sooner, making the model defensive earlier.']},
          'reserveTargetAmount':{
            'az':['Reserve Target AZN','Reserve üçün hədəf balansdır. Reserve Health = Current Reserve / Reserve Target. Config-də target-ı dəyişmək cari Reserve-ə dərhal pul əlavə etmir; target yüksələrsə deficit böyüyür və risk pressure arta bilər. Demo Reset zamanı Reserve bu target dəyərinə qaytarılır.','Artıranda eyni cari Reserve üçün Reserve Health azalır; daha böyük təhlükəsizlik hədəfi və daha çox bərpa ehtiyacı yaranır.','Azaldanda Reserve Health yüksəlir və target-a çatmaq asanlaşır, amma təhlükəsizlik buferi kiçilir.'],
            'ru':['Reserve Target AZN','Целевой баланс Reserve. Reserve Health = Current Reserve / Reserve Target. Изменение target не добавляет деньги в текущий Reserve мгновенно; при повышении target дефицит растёт и risk pressure может увеличиться. После Demo Reset Reserve возвращается к этому target.','Повышение снижает Reserve Health при том же текущем Reserve и создаёт больший target восстановления.','Снижение повышает Reserve Health и ускоряет достижение target, но уменьшает защитный буфер.'],
            'en':['Reserve Target AZN','The target Reserve balance. Reserve Health = Current Reserve / Reserve Target. Changing the target does not instantly add money to the current Reserve; a higher target creates a larger deficit and can raise risk pressure. Demo Reset restores Reserve to this target.','Increasing it lowers Reserve Health at the same current Reserve and creates a larger restoration target.','Decreasing it raises Reserve Health and makes the target easier to reach, but reduces the safety buffer.']},
          'reserveRestorePct':{
            'az':['Reserve Restore %','Reserve target-dan aşağıdırsa, müsbət Round GGR-in hansı hissəsinin House Cash-dan Reserve bərpasına köçürüldüyünü göstərir. Yalnız target-a qədər doldurur; Reserve doludursa bu parametr pul köçürmür.','Artıranda istifadə olunmuş Reserve daha tez bərpa olunur, amma həmin müsbət GGR-dən House Cash-da daha az qalır.','Azaldanda House Cash daha çox saxlayır, Reserve daha gec bərpa olunur.'],
            'ru':['Reserve Restore %','Если Reserve ниже target, определяет долю положительного Round GGR, которая переводится из House Cash на восстановление Reserve. Заполнение идёт только до target; при полном Reserve параметр ничего не переводит.','Увеличение быстрее восстанавливает Reserve, но оставляет меньше положительного GGR в House Cash.','Уменьшение оставляет больше в House Cash, но Reserve восстанавливается медленнее.'],
            'en':['Reserve Restore %','When Reserve is below target, this is the share of positive Round GGR moved from House Cash to restore Reserve. It restores only up to target; when Reserve is full, it moves nothing.','Increasing it restores used Reserve faster but leaves less of that positive GGR in House Cash.','Decreasing it keeps more in House Cash but restores Reserve more slowly.']},
          'minBet':{
            'az':['Min Bet','Player üçün qəbul edilən minimum stake-dir. Bu limit outcome RNG-ni və RTP-ni birbaşa dəyişmir.','Artıranda kiçik mərclər qəbul edilmir və minimum handle yüksəlir.','Azaldanda daha kiçik stake-lər qəbul edilə bilər.'],
            'ru':['Min Bet','Минимальная принимаемая ставка игрока. Напрямую не меняет outcome RNG или RTP.','Повышение отклоняет более мелкие ставки и повышает минимальный handle.','Снижение позволяет принимать более мелкие ставки.'],
            'en':['Min Bet','Minimum accepted player stake. It does not directly change outcome RNG or RTP.','Increasing it rejects smaller stakes and raises minimum handle.','Decreasing it allows smaller stakes.']},
          'maxBet':{
            'az':['Max Bet','Bir player bet-i üçün nominal maksimum stake limitidir. Bundan əlavə payout/exposure limitləri daha aşağı safe stake tələb edə bilər. RNG-ni birbaşa dəyişmir.','Artıranda daha böyük stake mümkün olur, amma liability və hard payout limitləri yenə tətbiq edilir.','Azaldanda maksimal stake və potensial liability azalır.'],
            'ru':['Max Bet','Номинальный максимальный stake одного player bet. Payout/exposure limits могут дополнительно снизить безопасную ставку. Напрямую RNG не меняет.','Повышение разрешает большую ставку, но liability и hard payout limits всё равно применяются.','Снижение уменьшает максимальный stake и потенциальную liability.'],
            'en':['Max Bet','Nominal maximum stake for one player bet. Payout/exposure limits can further reduce the safe stake. It does not directly change RNG.','Increasing it permits larger stakes, while liability and hard payout limits still apply.','Decreasing it reduces maximum stake and potential liability.']},
          'maxPayoutPerBet':{
            'az':['Max Payout / Bet','Bir bet üçün hard maksimum payout/liability limitidir. Safe stake hesabı multiplier ilə birlikdə bu limitə baxır.','Artıranda bir bet üzrə daha böyük potensial payout qəbul edilə bilər.','Azaldanda bir bet üzrə risk daha tez kəsilir və safe stake aşağı düşür.'],
            'ru':['Max Payout / Bet','Жёсткий максимум payout/liability для одной ставки. Safe stake учитывает этот лимит вместе с multiplier.','Повышение допускает больший потенциальный payout по одной ставке.','Снижение раньше ограничивает риск одной ставки и уменьшает safe stake.'],
            'en':['Max Payout / Bet','Hard maximum payout/liability for one bet. Safe-stake calculation uses this limit together with the multiplier.','Increasing it allows a larger potential payout on one bet.','Decreasing it cuts single-bet risk sooner and reduces safe stake.']},
          'maxPayoutPerRound':{
            'az':['Max Payout / Round','Eyni raundda bütün açıq bet-lərin cəmi üzrə hard exposure/payout limitidir. Cari Open Exposure bu limitdən yer tutur.','Artıranda bir raundda daha çox aggregate liability qəbul edilə bilər.','Azaldanda raund daha tez exposure limitinə çatır və yeni stake-lər məhdudlaşır.'],
            'ru':['Max Payout / Round','Жёсткий лимит общей exposure/payout всех открытых ставок одного раунда. Current Open Exposure занимает часть этого лимита.','Повышение допускает больше aggregate liability в одном раунде.','Снижение быстрее заполняет round exposure limit и ограничивает новые ставки.'],
            'en':['Max Payout / Round','Hard aggregate exposure/payout limit for all open bets in one round. Current Open Exposure consumes this capacity.','Increasing it allows more aggregate liability in a round.','Decreasing it reaches the round exposure limit sooner and constrains new stakes.']},
          'maxSessionExposure':{
            'az':['Session Exposure','Session üçün açıq liability üzrə əlavə hard tavanıdır. Round limiti ilə paralel işləyir; hansı limit daha sərtdirsə safe stake-i o müəyyən edir.','Artıranda session daxilində daha çox açıq risk mümkün olur.','Azaldanda session üzrə qəbul edilən ümumi exposure daha tez məhdudlaşır.'],
            'ru':['Session Exposure','Дополнительный жёсткий потолок открытой liability на session. Работает вместе с round limit; safe stake определяет более строгий лимит.','Повышение допускает больше открытого риска в session.','Снижение раньше ограничивает суммарную session exposure.'],
            'en':['Session Exposure','Additional hard ceiling for open liability in the session. It works alongside the round limit; the tighter limit controls safe stake.','Increasing it allows more open risk in the session.','Decreasing it constrains total session exposure sooner.']},
          'maxMultiplier':{
            'az':['Max Multiplier','Outcome generator-un hard üst əmsal tavanıdır; generated multiplier bu dəyərdən yuxarı çıxmır. Bu, ayrıca RTP target deyil.','Artıranda daha uzun tail və daha böyük mümkün payout/liability yaranır.','Azaldanda tail risk və maksimum mümkün payout azalır.'],
            'ru':['Max Multiplier','Жёсткий верхний предел коэффициента outcome generator: generated multiplier выше него не поднимается. Это не отдельный RTP target.','Повышение создаёт более длинный tail и больший возможный payout/liability.','Снижение уменьшает tail risk и максимальный возможный payout.'],
            'en':['Max Multiplier','Hard upper ceiling of the outcome generator; generated multiplier cannot exceed it. It is not a separate RTP target.','Increasing it creates a longer tail and larger possible payout/liability.','Decreasing it reduces tail risk and maximum possible payout.']},
          'growthRate':{
            'az':['Growth Rate','Player View-da multiplier-in zaman üzrə vizual/artım sürətidir. Preselected bust/outcome probability-ni yaratmır və Target RTP-ni dəyişmir; raundun real-time tempini dəyişir.','Artıranda multiplier ekranda daha tez yüksəlir və cashout qərarı üçün vaxt qısalır.','Azaldanda multiplier daha yavaş yüksəlir və raund vizual olaraq uzanır.'],
            'ru':['Growth Rate','Скорость роста multiplier во времени в Player View. Не генерирует preselected bust/outcome probability и не меняет Target RTP; меняет real-time темп раунда.','Повышение быстрее поднимает multiplier и сокращает время на cashout-решение.','Снижение замедляет рост multiplier и визуально удлиняет раунд.'],
            'en':['Growth Rate','Real-time visual/growth speed of the multiplier in Player View. It does not generate the preselected bust/outcome probability or change Target RTP; it changes round tempo.','Increasing it makes the multiplier rise faster and shortens cashout decision time.','Decreasing it slows multiplier growth and visually lengthens the round.']},
          'countdownMs':{
            'az':['Countdown ms','Yeni raund başlamazdan əvvəlki betting/countdown pəncərəsinin müddətidir, millisecond ilə. Outcome probability-ni dəyişmir.','Artıranda player-ın stake yerləşdirməsi üçün daha çox vaxt olur və raund cadence yavaşıyır.','Azaldanda betting window qısalır və raundlar daha tez başlayır.'],
            'ru':['Countdown ms','Длительность betting/countdown окна до старта нового раунда, в миллисекундах. Outcome probability не меняет.','Повышение даёт больше времени на размещение ставки и замедляет cadence раундов.','Снижение сокращает betting window и ускоряет старт раундов.'],
            'en':['Countdown ms','Length of the betting/countdown window before a new round starts, in milliseconds. It does not change outcome probability.','Increasing it gives more time to place a stake and slows round cadence.','Decreasing it shortens the betting window and starts rounds sooner.']},
          'animationSpeed':{
            'az':['Animation Speed','Yarış/character animasiyasının playback sürətidir. Math outcome və Target/Effective RTP-ni dəyişməməlidir; yalnız vizual hərəkətin tempidir.','Artıranda animasiya daha sürətli görünür.','Azaldanda animasiya daha yavaş görünür.'],
            'ru':['Animation Speed','Скорость playback анимации гонки/персонажа. Не должна менять math outcome или Target/Effective RTP; это только визуальный темп.','Повышение ускоряет визуальную анимацию.','Снижение замедляет визуальную анимацию.'],
            'en':['Animation Speed','Playback speed of race/character animation. It should not change math outcome or Target/Effective RTP; it is a visual tempo control.','Increasing it makes animation look faster.','Decreasing it makes animation look slower.']},
          'autoPlayMaxRounds':{
            'az':['Auto Max Rounds','Player-ın Auto Play funksiyası üçün maksimum raund sayını limitləyir. Live demo bot simulation sayını və outcome RNG-ni dəyişmir.','Artıranda player bir activation ilə daha çox auto raund seçə bilər.','Azaldanda Auto Play daha az raundla məhdudlaşır.'],
            'ru':['Auto Max Rounds','Ограничивает максимальное число раундов Player Auto Play. Не меняет число live demo bots или outcome RNG.','Повышение позволяет выбрать больше auto-раундов за один запуск.','Снижение ограничивает Auto Play меньшим числом раундов.'],
            'en':['Auto Max Rounds','Limits the maximum number of rounds for Player Auto Play. It does not change live demo bot count or outcome RNG.','Increasing it allows more auto rounds per activation.','Decreasing it caps Auto Play at fewer rounds.']},
          'usableReservePct':{
            'az':['Usable Reserve %','Risk engine-in Available Liquidity / Coverage hesabında Reserve-in neçə faizini istifadə oluna bilən risk kapitalı kimi saydığını göstərir: Liquidity = House Cash + Reserve × Usable %. Bu parametr özü Reserve-dən pul köçürmür.','Artıranda coverage yüksəlir və risk engine daha çox liquidity hesab edir.','Azaldanda coverage aşağı düşür və protection daha tez sərtləşə bilər.'],
            'ru':['Usable Reserve %','Доля Reserve, которую risk engine учитывает как доступный risk capital в Available Liquidity / Coverage: Liquidity = House Cash + Reserve × Usable %. Сам параметр деньги из Reserve не переводит.','Повышение увеличивает coverage и учитываемую liquidity.','Снижение уменьшает coverage и может раньше усиливать protection.'],
            'en':['Usable Reserve %','Share of Reserve counted by the risk engine as available risk capital in Available Liquidity / Coverage: Liquidity = House Cash + Reserve × Usable %. This setting does not itself move money from Reserve.','Increasing it raises coverage and counted liquidity.','Decreasing it lowers coverage and can make protection tighten earlier.']},
          'riskThresholds.warningCoverage':{
            'az':['Warning Coverage','Coverage Ratio = Available Liquidity / Open Liability. Coverage bu həddə və ya aşağı düşəndə WARNING zonası aktivləşə bilər. Normal sıra: Warning > Stress > Critical.','Artıranda WARNING daha erkən, daha yüksək coverage səviyyəsində başlayır.','Azaldanda WARNING daha gec başlayır.'],
            'ru':['Warning Coverage','Coverage Ratio = Available Liquidity / Open Liability. При coverage на этом уровне или ниже может включиться WARNING. Нормальный порядок: Warning > Stress > Critical.','Повышение включает WARNING раньше, при более высоком coverage.','Снижение включает WARNING позже.'],
            'en':['Warning Coverage','Coverage Ratio = Available Liquidity / Open Liability. At or below this ratio the WARNING zone can activate. Normal ordering: Warning > Stress > Critical.','Increasing it triggers WARNING earlier at a higher coverage ratio.','Decreasing it triggers WARNING later.']},
          'riskThresholds.stressCoverage':{
            'az':['Stress Coverage','Coverage Ratio bu həddə və ya aşağı düşəndə STRESS zonası aktivləşə bilər. Warning-dən aşağı, Critical-dan yuxarı saxlanması nəzərdə tutulur.','Artıranda STRESS daha erkən başlayır və stake/risk protection daha tez sərtləşir.','Azaldanda STRESS daha aşağı coverage-a qədər gecikir.'],
            'ru':['Stress Coverage','При Coverage Ratio на этом уровне или ниже может включиться STRESS. Предполагается ниже Warning и выше Critical.','Повышение раньше включает STRESS и быстрее ужесточает stake/risk protection.','Снижение откладывает STRESS до более низкого coverage.'],
            'en':['Stress Coverage','At or below this Coverage Ratio the STRESS zone can activate. It is intended to sit below Warning and above Critical.','Increasing it triggers STRESS earlier and tightens stake/risk protection sooner.','Decreasing it delays STRESS until lower coverage.']},
          'riskThresholds.criticalCoverage':{
            'az':['Critical Coverage','Coverage Ratio bu həddə və ya aşağı düşəndə CRITICAL zonası aktivləşir. Liability ON olduqda safe-stake capacity də bu həddən istifadə edir. Warning > Stress > Critical qaydasını qorumaq lazımdır.','Artıranda CRITICAL daha erkən başlayır və yeni liability daha sərt məhdudlaşır.','Azaldanda CRITICAL daha gec başlayır, amma liquidity buffer daha nazik ola bilər.'],
            'ru':['Critical Coverage','При Coverage Ratio на этом уровне или ниже включается CRITICAL. При Liability ON safe-stake capacity также использует этот threshold. Сохраняйте порядок Warning > Stress > Critical.','Повышение раньше включает CRITICAL и сильнее ограничивает новую liability.','Снижение позже включает CRITICAL, но liquidity buffer может стать тоньше.'],
            'en':['Critical Coverage','At or below this Coverage Ratio the CRITICAL zone activates. With Liability ON, safe-stake capacity also uses this threshold. Keep Warning > Stress > Critical.','Increasing it triggers CRITICAL earlier and constrains new liability more strongly.','Decreasing it triggers CRITICAL later, but can leave a thinner liquidity buffer.']}
          }
          rush_js=r'''(()=>{'use strict';const LANG=__LANG__,INFO=__INFO__,readLang=()=>{const a=document.querySelector('[data-lang].active')?.dataset.lang;let l=(a||localStorage.getItem(LANG)||'az').toLowerCase();return ['az','ru','en'].includes(l)?l:'az'};function open(path){const x=INFO[path],l=readLang();if(!x)return;const a=x[l]||x.en,m=document.querySelector('[data-modal]');if(!m)return;const q=s=>m.querySelector(s);q('[data-info-title]').textContent=a[0];q('[data-info-desc]').textContent=a[1];q('[data-info-up]').textContent=a[2];q('[data-info-down]').textContent=a[3];m.classList.add('open')}document.addEventListener('click',e=>{const b=e.target.closest?.('[data-info]');if(!b||!INFO[b.dataset.info])return;e.preventDefault();e.stopImmediatePropagation();open(b.dataset.info)},true);})();'''
          for slug in rush_slugs:
            base=Path('games')/slug
            (base/'admin-info-v28.js').write_text(rush_js.replace('__LANG__',json.dumps(rush_lang[slug])).replace('__INFO__',json.dumps(rush_info,ensure_ascii=False,separators=(',',':'))))

          # Goal Rush: audited against current code (margin->derived RTP, reserve floor, safety liability, build modes, penalty multipliers).
          goal_info={
            'cfgMargin':{'az':['Target Profit Margin','Əsas editable iqtisadi hədəfdir. Derived Target RTP = 100% − Target Profit Margin. Həm də BUILD/DEFENSIVE mode qərarında faktiki margin ilə müqayisə olunur.','Artıranda Derived RTP azalır və target margin-ə çatmaq üçün müdafiə rejimi daha uzun qala bilər.','Azaldanda Derived RTP artır və target margin tələbi yumşalır.'],'ru':['Target Profit Margin','Главный editable экономический target. Derived Target RTP = 100% − Target Profit Margin. Также используется при сравнении с фактической margin для BUILD/DEFENSIVE mode.','Повышение снижает Derived RTP и может дольше удерживать защитный режим до достижения target margin.','Снижение повышает Derived RTP и смягчает target margin.'],'en':['Target Profit Margin','Primary editable economic target. Derived Target RTP = 100% − Target Profit Margin. It is also compared with actual margin when choosing BUILD/DEFENSIVE mode.','Increasing it lowers Derived RTP and can keep defensive modes active longer until target margin is reached.','Decreasing it raises Derived RTP and relaxes the target-margin requirement.']},
            'cfgRtp':{'az':['Derived Target RTP','Read-only dəyərdir: 100% − Target Profit Margin. Bu faktiki RTP deyil. Goal Rush theoretical reach hesabında target payout profilini verir.','Birbaşa edit edilmir; Margin azalanda avtomatik artır.','Birbaşa edit edilmir; Margin artanda avtomatik azalır.'],'ru':['Derived Target RTP','Read-only значение: 100% − Target Profit Margin. Это не фактический RTP. В Goal Rush задаёт target payout profile для theoretical reach.','Напрямую не редактируется; автоматически растёт при снижении Margin.','Напрямую не редактируется; автоматически снижается при росте Margin.'],'en':['Derived Target RTP','Read-only value: 100% − Target Profit Margin. This is not actual RTP. In Goal Rush it supplies the target payout profile used by theoretical reach.','Not edited directly; it rises automatically when Margin is reduced.','Not edited directly; it falls automatically when Margin is increased.']},
            'cfgReserve':{'az':['Reserve Capital','Reset zamanı başlanğıc Reserve və treasury üçün reference target-dır. Current mode həm də cari Reserve-i bu dəyərin faizləri ilə müqayisə edir.','Artıranda eyni cari Reserve nisbətən daha zəif görünə bilər; resetdən sonra daha böyük reserve start olur.','Azaldanda reference reserve kiçilir; resetdən sonra daha az reserve start olur.'],'ru':['Reserve Capital','Стартовый Reserve после reset и reference target для treasury. Current mode также сравнивает текущий Reserve с процентами этого значения.','Повышение может сделать тот же текущий Reserve относительно слабее; после reset стартовый reserve больше.','Снижение уменьшает reference reserve; после reset стартовый reserve меньше.'],'en':['Reserve Capital','Starting Reserve after reset and treasury reference target. Current mode also compares current Reserve against percentages of this value.','Increasing it can make the same current Reserve look relatively weaker; reset starts with more reserve.','Decreasing it lowers the reference reserve; reset starts with less reserve.']},
            'cfgReserveFloor':{'az':['Reserve Floor','Risk qəbulunda istifadə edilməyən Reserve hissəsidir. Usable Reserve = max(0, Reserve Balance − Reserve Floor). Yəni floor liquidity kimi yeni liability-yə açılmır.','Artıranda free risk capital azalır, safe bet daha sərt olur.','Azaldanda daha çox Reserve risk capital kimi sayıla bilər.'],'ru':['Reserve Floor','Часть Reserve, которая не используется для принятия нового риска. Usable Reserve = max(0, Reserve Balance − Reserve Floor).','Повышение уменьшает free risk capital и делает safe bet строже.','Снижение позволяет учитывать больше Reserve как risk capital.'],'en':['Reserve Floor','Part of Reserve excluded from new-risk capacity. Usable Reserve = max(0, Reserve Balance − Reserve Floor).','Increasing it reduces free risk capital and makes safe-bet limits tighter.','Decreasing it lets more Reserve count as risk capital.']},
            'cfgSafety':{'az':['Safety Factor','Liability hesabına əlavə təhlükəsizlik əmsalıdır: Liability = Stake × (Multiplier − 1) × Safety Factor. Probability-ni birbaşa dəyişmir; bet acceptance/safe bet-i dəyişir.','Artıranda eyni bet daha çox liability sayılır və max safe bet azalır.','Azaldanda eyni bet daha az liability sayılır və daha çox risk qəbul edilə bilər.'],'ru':['Safety Factor','Дополнительный safety multiplier в liability: Liability = Stake × (Multiplier − 1) × Safety Factor. Напрямую probability не меняет; меняет acceptance/safe bet.','Повышение считает ту же ставку более рискованной и уменьшает max safe bet.','Снижение считает liability меньше и позволяет принять больше риска.'],'en':['Safety Factor','Extra safety multiplier in liability: Liability = Stake × (Multiplier − 1) × Safety Factor. It does not directly change probability; it changes acceptance/safe bet.','Increasing it counts the same bet as more liability and lowers max safe bet.','Decreasing it counts less liability and permits more risk.']},
            'cfgBuildCash':{'az':['Build Cash Target','House Cash üçün mode threshold-dur. Cari House Cash və faktiki margin bu target ilə birlikdə CRITICAL/BUILD/DEFENSIVE/NORMAL mode seçir; mode allowed multiplier target-ləri məhdudlaşdıra bilər.','Artıranda BUILD/DEFENSIVE rejimindən çıxmaq üçün daha çox House Cash lazım olur.','Azaldanda NORMAL rejimə daha tez keçmək mümkündür.'],'ru':['Build Cash Target','Mode-threshold для House Cash. Текущий House Cash и фактическая margin вместе с ним выбирают CRITICAL/BUILD/DEFENSIVE/NORMAL; mode может ограничивать allowed multiplier targets.','Повышение требует больше House Cash для выхода из BUILD/DEFENSIVE.','Снижение позволяет раньше перейти в NORMAL.'],'en':['Build Cash Target','House Cash mode threshold. Current House Cash and actual margin use it to choose CRITICAL/BUILD/DEFENSIVE/NORMAL; the mode can restrict allowed multiplier targets.','Increasing it requires more House Cash to exit BUILD/DEFENSIVE.','Decreasing it allows NORMAL mode sooner.']},
            'cfgMinBet':{'az':['Min Bet','Qəbul edilən minimum stake-dir. Probability-ni birbaşa dəyişmir.','Artıranda kiçik stake-lər qəbul edilmir.','Azaldanda daha kiçik stake qəbul oluna bilər.'],'ru':['Min Bet','Минимальная принимаемая ставка. Напрямую probability не меняет.','Повышение исключает мелкие ставки.','Снижение позволяет более мелкие ставки.'],'en':['Min Bet','Minimum accepted stake. It does not directly change probability.','Increasing it rejects smaller stakes.','Decreasing it allows smaller stakes.']},
            'cfgMaxBet':{'az':['Max Bet','Nominal maksimum stake-dir; free risk capital və liability hesabı bundan daha aşağı safe bet tələb edə bilər.','Artıranda daha böyük stake mümkündür, risk guard yenə tətbiq olunur.','Azaldanda maksimum stake aşağı düşür.'],'ru':['Max Bet','Номинальный максимум stake; free risk capital и liability могут потребовать меньший safe bet.','Повышение разрешает больший stake, risk guard всё равно действует.','Снижение уменьшает максимум stake.'],'en':['Max Bet','Nominal maximum stake; free risk capital and liability can still require a lower safe bet.','Increasing it allows larger stakes while the risk guard still applies.','Decreasing it lowers the maximum stake.']},
            'cfgPenLeft':{'az':['Penalty Left Multiplier','Final penalty-də sol zona üçün payout multiplier-dir. NORMAL mode-da target list-ə daxil olur və win chance theoretical reach = RTP / multiplier ilə hesablanır.','Artıranda payout böyüyür, həmin zonaya çatma/qazanma ehtimalı azalır.','Azaldanda payout kiçilir, theoretical win probability yüksəlir.'],'ru':['Penalty Left Multiplier','Payout multiplier левой зоны финального penalty. В NORMAL mode входит в target list; win chance считается как theoretical reach = RTP / multiplier.','Повышение увеличивает payout и уменьшает вероятность выигрыша этой зоны.','Снижение уменьшает payout и повышает theoretical win probability.'],'en':['Penalty Left Multiplier','Payout multiplier for the left final-penalty zone. In NORMAL mode it enters the target list; win chance uses theoretical reach = RTP / multiplier.','Increasing it raises payout and lowers the zone win probability.','Decreasing it lowers payout and raises theoretical win probability.']},
            'cfgPenCenter':{'az':['Penalty Center Multiplier','Final penalty-də mərkəz zona üçün payout multiplier-dir. NORMAL mode-da target list-ə daxil olur; chance RTP/multiplier əsasında azalır.','Artıranda mərkəz payout-u böyüyür, qazanma ehtimalı azalır.','Azaldanda payout azalır, qazanma ehtimalı yüksəlir.'],'ru':['Penalty Center Multiplier','Payout multiplier центральной зоны final penalty. В NORMAL mode входит в target list; chance уменьшается по RTP/multiplier.','Повышение увеличивает payout и снижает шанс выигрыша центра.','Снижение уменьшает payout и повышает шанс выигрыша.'],'en':['Penalty Center Multiplier','Payout multiplier for the center final-penalty zone. In NORMAL mode it enters the target list; chance decreases via RTP/multiplier.','Increasing it raises payout and lowers the center win chance.','Decreasing it lowers payout and raises the win chance.']},
            'cfgPenRight':{'az':['Penalty Right Multiplier','Final penalty-də sağ zona üçün payout multiplier-dir. NORMAL mode-da target list-ə daxil olur və theoretical reach RTP/multiplier ilə hesablanır.','Artıranda payout böyüyür, qazanma ehtimalı azalır.','Azaldanda payout azalır, qazanma ehtimalı yüksəlir.'],'ru':['Penalty Right Multiplier','Payout multiplier правой зоны final penalty. В NORMAL mode входит в target list; theoretical reach = RTP/multiplier.','Повышение увеличивает payout и снижает вероятность выигрыша.','Снижение уменьшает payout и повышает вероятность выигрыша.'],'en':['Penalty Right Multiplier','Payout multiplier for the right final-penalty zone. In NORMAL mode it enters the target list; theoretical reach = RTP/multiplier.','Increasing it raises payout and lowers win probability.','Decreasing it lowers payout and raises win probability.']}
          }
          common_modal=r'''function modal(){let m=document.querySelector('[data-v28-info-modal]');if(m)return m;m=document.createElement('div');m.dataset.v28InfoModal='';m.style.cssText='position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.74);display:none;place-items:center;padding:18px';m.innerHTML='<div style="width:min(620px,100%);max-height:86dvh;overflow:auto;background:var(--panel,#101820);color:var(--txt,var(--text,#fff));border:1px solid var(--line,#ffffff22);border-radius:18px;padding:18px;box-shadow:0 24px 70px #0009"><div style="display:flex;justify-content:space-between;gap:15px;align-items:start"><h3 data-v28-title style="margin:0;font-size:18px"></h3><button data-v28-close style="border:1px solid var(--line,#ffffff22);background:transparent;color:inherit;border-radius:9px;width:34px;height:34px;font-size:20px">×</button></div><p data-v28-desc style="line-height:1.55;color:var(--muted,#aeb5bf)"></p><div style="display:grid;grid-template-columns:1fr 1fr;gap:9px"><div style="padding:11px;border:1px solid var(--line,#ffffff22);border-radius:12px"><b data-v28-up-label></b><div data-v28-up style="margin-top:6px;font-size:12px;line-height:1.5;color:var(--muted,#aeb5bf)"></div></div><div style="padding:11px;border:1px solid var(--line,#ffffff22);border-radius:12px"><b data-v28-down-label></b><div data-v28-down style="margin-top:6px;font-size:12px;line-height:1.5;color:var(--muted,#aeb5bf)"></div></div></div></div>';document.body.append(m);m.querySelector('[data-v28-close]').onclick=()=>m.style.display='none';m.onclick=e=>{if(e.target===m)m.style.display='none'};return m}'''
          goal_js="(()=>{'use strict';const INFO="+json.dumps(goal_info,ensure_ascii=False,separators=(',',':'))+",L=()=>{const x=(localStorage.getItem('goalRush_lang')||'az').toLowerCase();return ['az','ru','en'].includes(x)?x:'az'};"+common_modal+r'''function show(k){const a=INFO[k]?.[L()]||INFO[k]?.en;if(!a)return;const m=modal(),q=s=>m.querySelector(s),l=L();q('[data-v28-title]').textContent=a[0];q('[data-v28-desc]').textContent=a[1];q('[data-v28-up-label]').textContent=l==='az'?'Artıranda':l==='ru'?'Если увеличить':'If increased';q('[data-v28-down-label]').textContent=l==='az'?'Azaldanda':l==='ru'?'Если уменьшить':'If decreased';q('[data-v28-up]').textContent=a[2];q('[data-v28-down]').textContent=a[3];m.style.display='grid'}function install(){for(const id of Object.keys(INFO)){const e=document.getElementById(id);if(!e)continue;const f=e.closest('.field'),lab=f?.querySelector('label');if(!lab||lab.querySelector('[data-v28-info]'))continue;const b=document.createElement('button');b.type='button';b.dataset.v28Info=id;b.textContent='i';b.title='Info';b.style.cssText='margin-left:6px;width:20px;height:20px;border-radius:50%;border:1px solid var(--cyan,#5edfff);background:transparent;color:var(--cyan,#5edfff);font-weight:900;line-height:18px;padding:0';lab.append(b)} }document.addEventListener('click',e=>{const b=e.target.closest?.('[data-v28-info]');if(b){e.preventDefault();show(b.dataset.v28Info)}},true);setInterval(install,700);install()})();'''
          Path('games/goal-rush/admin-info-v28.js').write_text(goal_js)

          penalty_info={
            'minBet':{'az':['Min Bet','Manual, Auto və Simulator üçün qəbul edilən minimum stake. RNG/RTP-ni birbaşa dəyişmir.','Artıranda kiçik stake-lər qəbul olunmur.','Azaldanda daha kiçik stake-lər qəbul edilir.'],'ru':['Min Bet','Минимальная ставка для Manual, Auto и Simulator. Напрямую RNG/RTP не меняет.','Повышение исключает мелкие ставки.','Снижение позволяет более мелкие ставки.'],'en':['Min Bet','Minimum accepted stake for Manual, Auto and Simulator. Does not directly change RNG/RTP.','Increasing rejects smaller stakes.','Decreasing allows smaller stakes.']},
            'maxBet':{'az':['Max Bet','Manual, Auto və Simulator üçün nominal maksimum stake limitidir. Exposure Guard daha aşağı safe stake tətbiq edə bilər.','Artıranda daha böyük stake mümkün olur, risk guard qalır.','Azaldanda maksimum stake aşağı düşür.'],'ru':['Max Bet','Номинальный максимум stake для Manual, Auto и Simulator. Exposure Guard может дать меньший safe stake.','Повышение разрешает больший stake, risk guard остаётся.','Снижение уменьшает максимум stake.'],'en':['Max Bet','Nominal maximum stake for Manual, Auto and Simulator. Exposure Guard can still impose a lower safe stake.','Increasing allows larger stakes while risk guard remains.','Decreasing lowers maximum stake.']},
            'highRoller':{'az':['High Roller Threshold','Stake-i high-roller kimi təsnif edən həddir və simulator stake ssenarilərinə təsir edir. Cari v25.12 modelində accepted bet RNG-ni dəyişmir.','Artıranda daha az bet high-roller kimi işarələnir.','Azaldanda daha çox bet high-roller kimi təsnif olunur.'],'ru':['High Roller Threshold','Порог классификации stake как high-roller и сценариев simulator. В текущем v25.12 RNG принятой ставки не меняет.','Повышение помечает меньше ставок как high-roller.','Снижение помечает больше ставок как high-roller.'],'en':['High Roller Threshold','Threshold that classifies a stake as high-roller and affects simulator stake scenarios. In current v25.12 it does not change accepted-bet RNG.','Increasing marks fewer bets as high-roller.','Decreasing marks more bets as high-roller.']},
            'jackpotAmount':{'az':['Jackpot Amount','Super Game jackpot açıq olduqda ödənilən fixed jackpot məbləğidir. Adi penalty ladder probability-ni dəyişmir.','Artıranda jackpot üçün tələb olunan liquidity yüksəlir.','Azaldanda jackpot payout və liquidity tələbi azalır.'],'ru':['Jackpot Amount','Фиксированная jackpot-выплата при открытом Super Game jackpot. Обычную penalty ladder probability не меняет.','Повышение увеличивает требуемую liquidity для jackpot.','Снижение уменьшает jackpot payout и liquidity requirement.'],'en':['Jackpot Amount','Fixed jackpot payout when the Super Game jackpot is unlocked. It does not change normal penalty-ladder probability.','Increasing raises the liquidity required for jackpot.','Decreasing lowers jackpot payout and liquidity requirement.']},
            'superBonusMultiplier':{'az':['Super Bonus Multiplier','Jackpot ödənmədikdə Super Game üçün guaranteed fallback payout multiplier-dir.','Artıranda fallback payout və liability artır.','Azaldanda fallback payout və liability azalır.'],'ru':['Super Bonus Multiplier','Guaranteed fallback payout multiplier в Super Game, если jackpot не выплачен.','Повышение увеличивает fallback payout и liability.','Снижение уменьшает fallback payout и liability.'],'en':['Super Bonus Multiplier','Guaranteed fallback payout multiplier in Super Game when jackpot is not paid.','Increasing raises fallback payout and liability.','Decreasing lowers fallback payout and liability.']},
            'payoutMin':{'az':['Payout / RTP Minimum','RTP PROFILE üçün aşağı target sərhədidir. İşləyən Target RTP midpoint ilə hesablanır: (Payout Min + Payout Max) / 2. Bu faktiki session RTP deyil.','Artıranda midpoint Target RTP yüksəlir.','Azaldanda midpoint Target RTP azalır.'],'ru':['Payout / RTP Minimum','Нижняя target-граница RTP PROFILE. Рабочий Target RTP = (Payout Min + Payout Max) / 2. Это не фактический session RTP.','Повышение увеличивает midpoint Target RTP.','Снижение уменьшает midpoint Target RTP.'],'en':['Payout / RTP Minimum','Lower target boundary of RTP PROFILE. Working Target RTP = (Payout Min + Payout Max) / 2. This is not actual session RTP.','Increasing raises midpoint Target RTP.','Decreasing lowers midpoint Target RTP.']},
            'payoutMax':{'az':['Payout / RTP Maximum','RTP PROFILE üçün yuxarı target sərhədidir. Midpoint Target RTP-ni formalaşdırır; current realized RTP-ni live olaraq zorla bu həddə qaytarmır.','Artıranda midpoint Target RTP yüksəlir.','Azaldanda midpoint Target RTP azalır.'],'ru':['Payout / RTP Maximum','Верхняя target-граница RTP PROFILE. Формирует midpoint Target RTP; не является live steering фактического RTP к этой границе.','Повышение увеличивает midpoint Target RTP.','Снижение уменьшает midpoint Target RTP.'],'en':['Payout / RTP Maximum','Upper target boundary of RTP PROFILE. It forms midpoint Target RTP; it is not live steering of realized RTP toward this boundary.','Increasing raises midpoint Target RTP.','Decreasing lowers midpoint Target RTP.']},
            'manualSave':{'az':['Manual Save Probability','FIXED PROFILE-də hər penalty step üçün eyni P(loss/save) dəyəridir. RTP PROFILE deyil; buna görə müxtəlif cashout target-lərdə implied RTP fərqlənə bilər.','Artıranda hər step-də uduzma/save ehtimalı artır və reach azalır.','Azaldanda step-ləri keçmə ehtimalı artır.'],'ru':['Manual Save Probability','В FIXED PROFILE одинаковая P(loss/save) на каждом penalty step. Это не RTP PROFILE, поэтому implied RTP отличается по cashout target.','Повышение увеличивает loss/save на каждом step и снижает reach.','Снижение повышает вероятность пройти steps.'],'en':['Manual Save Probability','In FIXED PROFILE, the same P(loss/save) is used at every penalty step. It is not RTP PROFILE, so implied RTP can differ by cashout target.','Increasing raises loss/save probability at each step and lowers reach.','Decreasing raises the chance of passing steps.']},
            'superGoal':{'az':['Super Goal Chance','SUPER mərhələsinə çatdıqdan sonra Super Game daxilində qol ehtimalıdır. Adi penalty ladder probability-ni dəyişmir.','Artıranda SUPER daxilində jackpot/fallback nəticəsinə çatma ehtimalı yüksəlir.','Azaldanda SUPER daxilində uğur ehtimalı azalır.'],'ru':['Super Goal Chance','Вероятность гола внутри Super Game после достижения SUPER. Обычную penalty ladder probability не меняет.','Повышение увеличивает шанс успешного Super outcome.','Снижение уменьшает шанс успеха внутри SUPER.'],'en':['Super Goal Chance','Goal probability inside Super Game after reaching SUPER. It does not change normal penalty-ladder probability.','Increasing raises the chance of a successful Super outcome.','Decreasing lowers success chance inside SUPER.']},
            'startBank':{'az':['Start House Cash','Reset-dən sonra House Cash üçün başlanğıc dəyərdir. Player deposit deyil və özü GGR sayılmır.','Artıranda demo daha çox ilkin operating cash ilə başlayır.','Azaldanda demo daha az ilkin House Cash ilə başlayır.'],'ru':['Start House Cash','Стартовый House Cash после reset. Это не player deposit и само по себе не GGR.','Повышение даёт больше начального operating cash.','Снижение даёт меньше стартового House Cash.'],'en':['Start House Cash','Starting House Cash after reset. It is not a player deposit and is not itself GGR.','Increasing gives more initial operating cash.','Decreasing gives less starting House Cash.']},
            'companyReserveStart':{'az':['Company Reserve Start','Reset-dən sonra Company Reserve başlanğıcı və reserve restoration target-dır.','Artıranda daha böyük reserve buffer və daha böyük restore target yaranır.','Azaldanda reserve buffer və restore target kiçilir.'],'ru':['Company Reserve Start','Старт Company Reserve после reset и target восстановления reserve.','Повышение создаёт больший reserve buffer и restore target.','Снижение уменьшает reserve buffer и restore target.'],'en':['Company Reserve Start','Starting Company Reserve after reset and the reserve-restoration target.','Increasing creates a larger reserve buffer and restoration target.','Decreasing reduces reserve buffer and restoration target.']},
            'reserveRefillRate':{'az':['Reserve Refill Rate','Positive NetHouseResult yarananda istifadə olunmuş Reserve-i target-a bərpa etmək üçün ayrılan faizdir: min(NetHouseResult × Rate, Reserve Target − Reserve). Reserve doludursa bütün positive result House Cash-da qalır.','Artıranda Reserve daha tez bərpa olunur, həmin positive result-dan House Cash-a az qalır.','Azaldanda House Cash daha çox saxlayır, Reserve daha gec bərpa olunur.'],'ru':['Reserve Refill Rate','Доля positive NetHouseResult на восстановление использованного Reserve: min(NetHouseResult × Rate, Reserve Target − Reserve). При полном Reserve весь positive result остаётся в House Cash.','Повышение быстрее восстанавливает Reserve и оставляет меньше текущего positive result в House Cash.','Снижение оставляет больше House Cash, но медленнее восстанавливает Reserve.'],'en':['Reserve Refill Rate','Share of positive NetHouseResult used to restore Reserve: min(NetHouseResult × Rate, Reserve Target − Reserve). When Reserve is full, all positive result remains in House Cash.','Increasing restores Reserve faster and leaves less of that positive result in House Cash.','Decreasing leaves more in House Cash but restores Reserve more slowly.']},
            'cashProtectionTarget':{'az':['Cash Protection Target','Cari v25.12-də Treasury dashboard üçün target/warning səviyyəsidir. Accepted-round RNG-ni dəyişmir; House Cash aşağı olduqda risk status/hesabatı göstərir.','Artıranda dashboard daha uzun müddət treasury-ni target-dan aşağı göstərə bilər.','Azaldanda target-a daha tez çatılır.'],'ru':['Cash Protection Target','В текущем v25.12 это Treasury target/warning level для dashboard. RNG принятого раунда не меняет; показывает risk status при низком House Cash.','Повышение дольше держит dashboard ниже treasury target.','Снижение позволяет раньше достичь target.'],'en':['Cash Protection Target','In current v25.12 this is a Treasury target/warning level for the dashboard. It does not change accepted-round RNG; it flags risk status when House Cash is low.','Increasing can keep the dashboard below treasury target longer.','Decreasing makes the target easier to reach.']},
            'hardReserve':{'az':['Hard Reserve','Jackpot gating üçün əlavə tələb olunan cash remainder/reference dəyəridir. Faktiki Company Reserve balansı deyil.','Artıranda jackpot açılması üçün daha sərt cash şərti yaranır.','Azaldanda jackpot gating daha yumşaq olur.'],'ru':['Hard Reserve','Дополнительный cash remainder/reference для jackpot gating. Это не фактический баланс Company Reserve.','Повышение ужесточает cash-condition для открытия jackpot.','Снижение смягчает jackpot gating.'],'en':['Hard Reserve','Additional cash remainder/reference used by jackpot gating. It is not the actual Company Reserve balance.','Increasing makes jackpot cash conditions stricter.','Decreasing makes jackpot gating looser.']},
            'jackpotUnlockCash':{'az':['Jackpot Unlock Cash','Jackpot-a icazə üçün configured minimum House Cash threshold-dur. Faktiki unlock = max(configured unlock, Jackpot Amount + required remainder).','Artıranda jackpot daha gec açılır və daha çox House Cash tələb edir.','Azaldanda configured threshold yumşalır, amma jackpot + remainder minimumu yenə qalır.'],'ru':['Jackpot Unlock Cash','Configured minimum House Cash threshold для разрешения jackpot. Actual unlock = max(configured unlock, Jackpot Amount + required remainder).','Повышение позже открывает jackpot и требует больше House Cash.','Снижение смягчает configured threshold, но минимум jackpot + remainder остаётся.'],'en':['Jackpot Unlock Cash','Configured minimum House Cash threshold to allow jackpot. Actual unlock = max(configured unlock, Jackpot Amount + required remainder).','Increasing unlocks jackpot later and requires more House Cash.','Decreasing relaxes the configured threshold, while jackpot + remainder minimum still applies.']},
            'jackpotRemainder':{'az':['Jackpot Remainder','Jackpot payout-dan sonra House Cash-da qalmalı minimum məbləğdir və actual unlock hesabına daxildir.','Artıranda jackpot üçün əvvəlcədən daha çox cash tələb olunur.','Azaldanda jackpot sonrası tələb olunan buffer kiçilir.'],'ru':['Jackpot Remainder','Минимум House Cash, который должен остаться после jackpot payout; входит в actual unlock.','Повышение требует больше cash до jackpot.','Снижение уменьшает требуемый buffer после jackpot.'],'en':['Jackpot Remainder','Minimum House Cash that must remain after jackpot payout; it is part of actual unlock calculation.','Increasing requires more cash before jackpot.','Decreasing reduces the required post-jackpot buffer.']},
            'safetyFactor':{'az':['Safety Factor','Exposure Guard üçün liability buffer-dir: Liability = Stake × (Multiplier − 1) × Safety Factor. Accepted bet RNG-ni dəyişmir.','Artıranda eyni bet daha böyük liability sayılır və qəbul limiti sərtləşir.','Azaldanda eyni bet daha az liability sayılır və daha çox risk qəbul edilə bilər.'],'ru':['Safety Factor','Liability buffer Exposure Guard: Liability = Stake × (Multiplier − 1) × Safety Factor. RNG принятой ставки не меняет.','Повышение считает ту же ставку более рискованной и ужесточает acceptance.','Снижение считает liability меньше и позволяет больше риска.'],'en':['Safety Factor','Liability buffer for Exposure Guard: Liability = Stake × (Multiplier − 1) × Safety Factor. It does not change accepted-bet RNG.','Increasing counts the same bet as more liability and tightens acceptance.','Decreasing counts less liability and permits more risk.']},
            'usableReservePct':{'az':['Usable Reserve %','Exposure Guard-un yeni liability üçün Company Reserve-dən neçə faizini available risk kimi saydığını göstərir: Available Risk = House Cash + Reserve × % − Locked Liability.','Artıranda qəbul üçün hesablanan risk capital artır.','Azaldanda yeni bet-lər üçün hesablanan risk capital azalır.'],'ru':['Usable Reserve %','Доля Company Reserve, которую Exposure Guard считает available risk для новой liability: Available Risk = House Cash + Reserve × % − Locked Liability.','Повышение увеличивает учитываемый risk capital.','Снижение уменьшает risk capital для новых ставок.'],'en':['Usable Reserve %','Share of Company Reserve counted by Exposure Guard as available risk for new liability: Available Risk = House Cash + Reserve × % − Locked Liability.','Increasing raises counted risk capital.','Decreasing lowers risk capital available to new bets.']},
            'simulatorVirtualBalance':{'az':['Simulator Virtual Balance','Hər virtual P0001/P0002/... simulator player üçün başlanğıc wallet-dir. House Cash deyil və başlanğıcda GGR sayılmır.','Artıranda simulator player-lər daha uzun/iri stake ssenariləri işlədə bilər.','Azaldanda virtual player wallet daha tez tükənə bilər.'],'ru':['Simulator Virtual Balance','Стартовый wallet каждого virtual P0001/P0002/... simulator player. Это не House Cash и не стартовый GGR.','Повышение позволяет simulator players дольше/крупнее ставить.','Снижение быстрее ограничивает virtual player wallet.'],'en':['Simulator Virtual Balance','Starting wallet for each virtual P0001/P0002/... simulator player. It is not House Cash and is not starting GGR.','Increasing lets simulator players support longer/larger stake scenarios.','Decreasing can exhaust virtual player wallets sooner.']}
          }
          penalty_js="(()=>{'use strict';const INFO="+json.dumps(penalty_info,ensure_ascii=False,separators=(',',':'))+",L=()=>{const x=(localStorage.getItem('casinoPenaltyLanguage')||'RU').toUpperCase();return x==='AZ'?'az':x==='EN'?'en':'ru'};"+common_modal+r'''function show(k){const a=INFO[k]?.[L()]||INFO[k]?.en;if(!a)return;const m=modal(),q=s=>m.querySelector(s),l=L();q('[data-v28-title]').textContent=a[0];q('[data-v28-desc]').textContent=a[1];q('[data-v28-up-label]').textContent=l==='az'?'Artıranda':l==='ru'?'Если увеличить':'If increased';q('[data-v28-down-label]').textContent=l==='az'?'Azaldanda':l==='ru'?'Если уменьшить':'If decreased';q('[data-v28-up]').textContent=a[2];q('[data-v28-down]').textContent=a[3];m.style.display='grid'}function install(){for(const k of Object.keys(INFO)){const e=document.getElementById('set-'+k);if(!e)continue;const s=e.closest('.setting')||e.parentElement,lab=s?.querySelector('label');if(!lab||lab.querySelector('[data-v28-info]'))continue;const b=document.createElement('button');b.type='button';b.dataset.v28Info=k;b.textContent='i';b.title='Info';b.style.cssText='margin-left:7px;width:19px;height:19px;border-radius:50%;border:1px solid var(--cyan,#00f0ff);background:transparent;color:var(--cyan,#00f0ff);font-weight:900;padding:0;line-height:17px';lab.append(b)}}document.addEventListener('click',e=>{const b=e.target.closest?.('[data-v28-info]');if(b){e.preventDefault();e.stopPropagation();show(b.dataset.v28Info)}},true);setInterval(install,700);install()})();'''
          Path('games/penalty/admin-info-v28.js').write_text(penalty_js)

          # Robust injection before </html>; works even with the legacy malformed Camel </body> sequence.
          for slug in rush_slugs+['goal-rush','penalty']:
            p=Path('games')/slug/'admin.html';s=p.read_text();tag='<script src="admin-info-v28.js?v=2.8"></script>'
            s=re.sub(r'<script src="admin-info-v28\.js[^>]*></script>','',s,flags=re.I)
            pos=s.lower().rfind('</html>')
            s=(s[:pos]+tag+s[pos:]) if pos>=0 else s+tag
            p.write_text(s)

          # README audit note.
          for slug in rush_slugs+['goal-rush','penalty']:
            rp=Path('games')/slug/'README.md'
            if rp.exists():
              r=rp.read_text()
              if 'V2.8 Admin Info Audit' not in r:
                r+='\n## V2.8 Admin Info Audit\n- Every active math/treasury/risk config now has code-accurate AZ/RU/EN info help.\n- Help explicitly distinguishes Target vs Actual, RTP vs Payout Budget, soft risk feedback vs hard limits, and settings that do not change RNG.\n- Explanations were written against each game\'s current implementation rather than copied generically across games.\n- Player visuals and gameplay are unchanged.\n'
                rp.write_text(r)
          PY
      - name: Validate JS and audited coverage
        shell: bash
        run: |
          set -euo pipefail
          for f in games/camel-rush/admin-info-v28.js games/horse-rush/admin-info-v28.js games/Greyhound-Rush/admin-info-v28.js games/sonic-rush/admin-info-v28.js games/goal-rush/admin-info-v28.js games/penalty/admin-info-v28.js; do node --check "$f"; done
          for f in games/camel-rush/admin.html games/horse-rush/admin.html games/Greyhound-Rush/admin.html games/sonic-rush/admin.html games/goal-rush/admin.html games/penalty/admin.html; do grep -q 'admin-info-v28.js?v=2.8' "$f"; done
          python3 - <<'PY'
          from pathlib import Path
          fields=['liabilityCoverageEnabled','targetProfitMargin','payoutBudgetPct','reserveTargetAmount','reserveRestorePct','minBet','maxBet','maxPayoutPerBet','maxPayoutPerRound','maxSessionExposure','maxMultiplier','growthRate','countdownMs','animationSpeed','autoPlayMaxRounds','usableReservePct','riskThresholds.warningCoverage','riskThresholds.stressCoverage','riskThresholds.criticalCoverage']
          for slug in ['camel-rush','horse-rush','Greyhound-Rush','sonic-rush']:
            js=(Path('games')/slug/'admin-info-v28.js').read_text()
            missing=[x for x in fields if x not in js]
            if missing: raise SystemExit(f'{slug}: missing info {missing}')
          goal=(Path('games/goal-rush/admin-info-v28.js')).read_text()
          for x in ['cfgMargin','cfgRtp','cfgReserve','cfgReserveFloor','cfgSafety','cfgBuildCash','cfgMinBet','cfgMaxBet','cfgPenLeft','cfgPenCenter','cfgPenRight']:
            if x not in goal: raise SystemExit('goal missing '+x)
          pen=(Path('games/penalty/admin-info-v28.js')).read_text()
          for x in ['minBet','maxBet','highRoller','jackpotAmount','superBonusMultiplier','payoutMin','payoutMax','manualSave','superGoal','startBank','companyReserveStart','reserveRefillRate','cashProtectionTarget','hardReserve','jackpotUnlockCash','jackpotRemainder','safetyFactor','usableReservePct','simulatorVirtualBalance']:
            if x not in pen: raise SystemExit('penalty missing '+x)
          PY
      - name: Commit audited help
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games
          git commit -m 'Crash V2.8: code-accurate AZ RU EN admin info help'
          git push
