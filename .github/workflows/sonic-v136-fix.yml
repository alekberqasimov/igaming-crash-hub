name: Sonic v1.3.6 Fix
on:
  push:
    branches: [main]
    paths: ['.sonic-v136-trigger']
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger Sonic v1.3.6 patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sonic-solo-bust-null-v136
          fetch-depth: 0
      - name: Fix solo null bust handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('games/sonic-rush/index.html')
          s=p.read_text()
          old="const sharedBust=window.IGCHSonicRoom?.takeAuthoritativeBust?.();world.bust=Number.isFinite(Number(sharedBust))?Number(sharedBust):bust(world.cfg);"
          new="const sharedBust=window.IGCHSonicRoom?.takeAuthoritativeBust?.();const sharedBustNum=Number(sharedBust);world.bust=(sharedBust!==null&&sharedBust!==undefined&&Number.isFinite(sharedBustNum)&&sharedBustNum>=1)?sharedBustNum:bust(world.cfg);"
          if old not in s:
              raise SystemExit('startCountdown sharedBust marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add games/sonic-rush/index.html
          git diff --cached --quiet || git commit -m 'Sonic v1.3.6: reject null or sub-1 shared bust'
          git push origin HEAD:fix/sonic-solo-bust-null-v136
