name: Rush V2.6 Synchronized Round History
on:
  push:
    paths:
      - '.github/rush-history-v26-trigger.txt'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make round history persistent across Player and Admin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          games=['camel-rush','horse-rush','Greyhound-Rush','sonic-rush']
          for slug in games:
              p=Path('games')/slug/'continuous-engine.js'
              s=p.read_text()

              old="const K={presence:META.prefix+'_player_presence_v25',lock:META.prefix+'_admin_engine_lock_v25',clock:META.prefix+'_engine_clock_v25',last:META.prefix+'_engine_last_round_v25'};"
              new="const K={presence:META.prefix+'_player_presence_v25',lock:META.prefix+'_admin_engine_lock_v25',clock:META.prefix+'_engine_clock_v25',last:META.prefix+'_engine_last_round_v25',history:META.prefix+'_round_history_v26'};"
              if old not in s and "_round_history_v26" not in s:
                  raise SystemExit(slug+': K marker missing')
              s=s.replace(old,new,1)

              marker="const money=n=>Math.round((Number(n)||0)*100)/100;"
              history_code=r'''const money=n=>Math.round((Number(n)||0)*100)/100;
function historyList(){const h=read(K.history,[]);return Array.isArray(h)?h:[]}
function historyMultiplier(log){for(const k of ['displayMultiplier','bustMultiplier','bust','rawBust']){const n=Number(log?.[k]);if(Number.isFinite(n)&&n>=1)return n}return null}
function saveHistory(h){h=(Array.isArray(h)?h:[]).filter(x=>Number.isFinite(Number(x?.multiplier))&&Number(x.multiplier)>=1).slice(-120);write(K.history,h)}
function appendHistory(roundNo,multiplier,source='ENGINE',ts=Date.now()){
  multiplier=Number(multiplier);if(!Number.isFinite(multiplier)||multiplier<1)return;
  const rn=Number(roundNo),key=Number.isFinite(rn)?'R-'+Math.floor(rn):source+'-'+ts+'-'+Math.random().toString(36).slice(2,7);
  const h=historyList(),idx=h.findIndex(x=>x.key===key);
  const item={key,round:Number.isFinite(rn)?Math.floor(rn):null,multiplier:Math.floor(multiplier*100)/100,source,ts:Number(ts)||Date.now()};
  if(idx>=0)h[idx]=item;else h.push(item);saveHistory(h)
}
function clearHistory(){write(K.history,[])}
function bootstrapHistory(){
  const f=finance(cfg()),logs=read(META.logs,[]);
  if(f.rounds===0&&(!Array.isArray(logs)||!logs.length)){clearHistory();return}
  if(historyList().length)return;
  if(!Array.isArray(logs)||!logs.length)return;
  const usable=logs.map((l,i)=>({l,i,m:historyMultiplier(l),ts:Number(l?.time??l?.timestamp??0)})).filter(x=>x.m!==null).sort((a,b)=>a.ts-b.ts).slice(-40);
  const h=usable.map((x,i)=>({key:'LEGACY-'+(x.l?.roundId??x.l?.id??x.ts??i)+'-'+i,round:null,multiplier:Math.floor(x.m*100)/100,source:'LOG',ts:x.ts||Date.now()+i}));
  if(h.length)saveHistory(h)
}
function historyBox(){return document.querySelector('[data-history]')}
function renderHistory(){
  if(IS_ADMIN)return;const box=historyBox();if(!box)return;
  const h=historyList().slice(-16),camel=META.name==='Camel Rush',view=camel?h:h.slice().reverse(),base=camel?'history-pill':'pill';
  box.innerHTML=view.map(x=>{const m=Number(x.multiplier),cls=m<1.5?'low':m<5?'mid':m<10?'high':'legend';return '<span class="'+base+' '+cls+'" data-shared-round="'+(x.round??'')+'">'+m.toFixed(2)+'x</span>'}).join('');
  if(camel)requestAnimationFrame(()=>{box.scrollLeft=box.scrollWidth})
}
function visualMultiplier(){const el=document.querySelector('[data-mult],[data-multiplier]');if(!el)return null;const m=parseFloat(String(el.textContent||'').replace(',','.'));return Number.isFinite(m)&&m>=1?m:null}
'''
              if 'function historyList()' not in s:
                  if marker not in s: raise SystemExit(slug+': money marker missing')
                  s=s.replace(marker,history_code,1)

              old_tail="write(META.logs,logs);write(K.last,{ts:now,rounds:f.rounds});return f}"
              new_tail="write(META.logs,logs);appendHistory(f.rounds,b,'ADMIN',now);write(K.last,{ts:now,rounds:f.rounds});return f}"
              if old_tail in s:
                  s=s.replace(old_tail,new_tail,1)
              elif "appendHistory(f.rounds,b,'ADMIN'" not in s:
                  raise SystemExit(slug+': runRound tail marker missing')

              old_player="if(!IS_ADMIN){playerBeat();const beat=setInterval(playerBeat,700);addEventListener('pagehide',()=>{clearInterval(beat);clearBeat()});addEventListener('beforeunload',clearBeat);return}"
              new_player=r'''if(!IS_ADMIN){
  bootstrapHistory();
  playerBeat();
  let lastPlayerRounds=finance(cfg()).rounds,lastPlayerReset=localStorage.getItem(META.reset)||'';
  renderHistory();
  const syncPlayerHistory=()=>{
    const reset=localStorage.getItem(META.reset)||'';
    if(reset!==lastPlayerReset){lastPlayerReset=reset;clearHistory();lastPlayerRounds=finance(cfg()).rounds;renderHistory();return}
    const f=finance(cfg());
    if(f.rounds<lastPlayerRounds){clearHistory();lastPlayerRounds=f.rounds;renderHistory();return}
    if(f.rounds>lastPlayerRounds){
      const current=visualMultiplier();
      const recent=read(META.logs,[]),fallback=Array.isArray(recent)&&recent.length?historyMultiplier(recent[recent.length-1]):null;
      const m=current??fallback;
      if(m!==null){for(let r=lastPlayerRounds+1;r<=f.rounds;r++)appendHistory(r,m,'PLAYER',Date.now()+r)}
      lastPlayerRounds=f.rounds;
    }
    renderHistory();
  };
  const beat=setInterval(playerBeat,700),historyTimer=setInterval(syncPlayerHistory,220);
  window.addEventListener('storage',e=>{if(e.key===K.history||e.key===META.logs)renderHistory()});
  addEventListener('pagehide',()=>{clearInterval(beat);clearInterval(historyTimer);clearBeat()});
  addEventListener('beforeunload',clearBeat);
  return
}'''
              if old_player in s:
                  s=s.replace(old_player,new_player,1)
              elif 'syncPlayerHistory' not in s:
                  raise SystemExit(slug+': player branch marker missing')

              old_reset="if(reset!==lastReset){lastReset=reset;nextDue=now+250;write(K.clock,{ts:now})}"
              new_reset="if(reset!==lastReset){lastReset=reset;clearHistory();nextDue=now+250;write(K.clock,{ts:now})}"
              if old_reset in s:
                  s=s.replace(old_reset,new_reset,1)

              if 'bootstrapHistory();\nlet nextDue=' not in s:
                  s=s.replace("let nextDue=Date.now()+500,lastReset=localStorage.getItem(META.reset)||'';","bootstrapHistory();\nlet nextDue=Date.now()+500,lastReset=localStorage.getItem(META.reset)||'';",1)

              p.write_text(s)

              for fn in ['index.html','admin.html']:
                  hp=Path('games')/slug/fn
                  txt=hp.read_text()
                  txt=txt.replace('continuous-engine.js?v=2.5','continuous-engine.js?v=2.6')
                  hp.write_text(txt)

              hub=Path('games')/slug/'hub.json'
              if hub.exists():
                  h=json.loads(hub.read_text());h['version']='2.6';h['description']=h.get('description','')+' Round history is synchronized across Player/Admin and persists every settled round multiplier.';hub.write_text(json.dumps(h,ensure_ascii=False,indent=2)+'\n')
              readme=Path('games')/slug/'README.md'
              if readme.exists():
                  r=readme.read_text()
                  if 'V2.6 Synchronized Round History' not in r:
                      r+='\n## V2.6 Synchronized Round History\n- Every completed live round stores its final multiplier in shared persistent history.\n- Rounds generated while Admin is open appear in Player View history when you return.\n- Player-generated spectator rounds are also persisted, even when the user did not place a bet.\n- History and finance round count stay synchronized after Reset Demo Data.\n- Existing player visual design, animation, V2 math and Liability Coverage ON/OFF are unchanged.\n'
                      readme.write_text(r)
          PY
      - name: Validate JavaScript and sync markers
        shell: bash
        run: |
          set -euo pipefail
          for f in games/camel-rush/continuous-engine.js games/horse-rush/continuous-engine.js games/Greyhound-Rush/continuous-engine.js games/sonic-rush/continuous-engine.js; do
            node --check "$f"
            grep -q '_round_history_v26' "$f"
            grep -q 'appendHistory(f.rounds,b' "$f"
            grep -q 'syncPlayerHistory' "$f"
          done
          grep -q 'camel-wrap' games/camel-rush/index.html
          grep -q 'horse-body' games/horse-rush/index.html
          grep -q 'Greyhound Rush' games/Greyhound-Rush/index.html
          grep -q 'runner-svg' games/sonic-rush/index.html
      - name: Package V2.6
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rush-v26
          (cd games/camel-rush && zip -q ../../rush-v26/Camel_Rush_V2_6_GitHub.zip index.html admin.html continuous-engine.js hub.json README.md)
          (cd games/horse-rush && zip -q ../../rush-v26/Horse_Rush_V2_6_GitHub.zip index.html admin.html continuous-engine.js hub.json README.md)
          (cd games/Greyhound-Rush && zip -q ../../rush-v26/Greyhound_Rush_V2_6_GitHub.zip index.html admin.html continuous-engine.js hub.json README.md)
          (cd games/sonic-rush && zip -q ../../rush-v26/Sonic_Rush_V2_6_GitHub.zip index.html admin.html continuous-engine.js hub.json README.md)
          zip -q -j rush-v26/Rush_Family_V2_6_All_Games.zip rush-v26/*_GitHub.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Rush-Family-V2.6-Synchronized-History
          path: rush-v26/*.zip
          retention-days: 30
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/camel-rush games/horse-rush games/Greyhound-Rush games/sonic-rush
          git commit -m 'Rush V2.6: synchronize round history across Player and Admin'
          git push
