name: Sonic P2P Cache and Discovery Fix
on:
  push:
    paths:
      - '.github/sonic-p2p-fix-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Sonic loader and P2P strategy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('games/sonic-rush/index.html')
          s=p.read_text(encoding='utf-8')
          old='../shared/player-hub-link-v213.js?v=2.13'
          new='../shared/player-hub-link-v214.js?v=2.14.1'
          if old not in s and new not in s:
              raise SystemExit('Sonic shared loader marker not found')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          p=Path('games/shared/sonic-global-p2p-room-v1.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const VERSION = '1.0.1';", "const VERSION = '1.1.0';")
          s=s.replace("const TRYSTERO_URL = 'https://esm.run/trystero@0.25.4';", "const TRYSTERO_URL = 'https://esm.run/@trystero-p2p/mqtt@0.25.4';")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add games/sonic-rush/index.html games/shared/sonic-global-p2p-room-v1.js
          git diff --cached --quiet || (git commit -m 'Fix Sonic P2P cache bust and use MQTT discovery' && git push)