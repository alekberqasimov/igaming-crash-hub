name: Rocket Crash Best v1.7 Pre-Cert QA

on:
  push:
    branches:
      - feature/rocket-crash-best-v16
      - main
    paths:
      - 'games/rocket-crash-best/**'
      - '.github/workflows/rocket-crash-best-qa.yml'
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check games/rocket-crash-best/math-core-v17.js
          node --check games/rocket-crash-best/risk-engine-v17.js
          node --check games/rocket-crash-best/core-v17.js
      - name: v1.7 architecture and UI audit
        run: node games/rocket-crash-best/tests/v17.test.cjs
      - name: RNG distribution pre-cert audit
        run: node games/rocket-crash-best/tests/rng-stat-v17.test.cjs
      - name: 10K margin convergence audit
        run: node games/rocket-crash-best/tests/margin-10k-v17.test.cjs
