{color:#ca84ff}.pill.hot{color:#ffd05e}.grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:11px;margin-top:11px}.game{overflow:hidden;border:1px solid var(--line);border-radius:21px;background:#07101c;box-shadow:0 26px 80px #0009}.scene{height:510px;position:relative;overflow:hidden;background:radial-gradient(circle at 68% 30%,#18507c4d,transparent 22%),radial-gradient(circle at 48% 100%,#3319704a,transparent 38%),linear-gradient(#071427,#071325 60%,#050913)}.stars{position:absolute;inset:0;background-image:radial-gradient(circle,#fff 0 1px,transparent 1.5px),radial-gradient(circle,#68deff 0 1px,transparent 1.5px);background-size:103px 103px,149px 149px;background-position:0 0,30px 55px;opacity:.4;animation:stars 25s linear infinite}@keyframes stars{to{background-position:-320px 90px,-240px 110px}}.horizon{position:absolute;left:-5%;right:-5%;bottom:-1%;height:35%;background:linear-gradient(transparent,#06111d),linear-gradient(145deg,transparent 39%,#0c1d2e 40% 58%,transparent 59%),linear-gradient(40deg,transparent 42%,#0a1727 43% 62%,transparent 63%)}.arc{position:absolute;left:1%;bottom:2%;width:95%;height:72%;border:4px solid transparent;border-top-color:var(--orange);border-radius:50%;transform:rotate(-21deg);filter:drop-shadow(0 0 8px #ff9418) drop-shadow(0 0 22px #ff5b0033);opacity:.85}.multbox{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);text-align:center;z-index:4}.phase{font-size:10px;letter-spacing:.19em;color:var(--cyan);font-weight:1000}.mult{font-size:clamp(66px,10vw,110px);line-height:.9;font-weight:1000;letter-spacing:-.07em;text-shadow:0 0 32px #28dcff55}.round{position:absolute;left:14px;top:14px;padding:10px 12px;border:1px solid #1d4665;border-radius:13px;background:#071526dc;z-index:5}.round small{display:block;color:var(--muted);font-size:8px;text-transform:uppercase}.round b{display:block;margin:2px 0 8px;font-size:12px}.round b:last-child{margin-bottom:0}.rocket{position:absolute;left:66%;top:22%;width:155px;height:220px;transform:rotate(35deg);filter:drop-shadow(0 20px 18px #0009) drop-shadow(0 0 18px #24d9ff44);transition:transform .1s linear}.rocket.run{animation:float .8s ease-in-out infinite alternate}@keyframes float{to{transform:rotate(37deg) translateY(-8px)}}.rocket svg{width:100%;height:100%}.flame{transform-origin:50% 10%;animation:flame .15s ease-in-out infinite alternate}@keyframes flame{to{transform:scaleY(1.18) scaleX(.85)}}.controls{padding:11px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;background:#070e18}.ctrl{padding:11px;border:1px solid var(--line);border-radius:14px;background:#0a1627}.ctrl h3{margin:0 0 8px;font-size:9px;letter-spacing:.12em}.field{display:flex;align-items:center;gap:6px;padding:8px;border:1px solid #203d59;border-radius:10px;background:#06111f}.field input{min-width:0;flex:1;border:0;outline:0;background:none;color:#fff;font-size:20px;font-weight:900}.quick{display:flex;gap:5px;margin-top:7px}.quick button{flex:1;border:1px solid #213b56;border-radius:7px;background:#0b1a2d;color:#d7e3ed;padding:6px;font-size:8px}.quick button.on{background:linear-gradient(135deg,#6034bd,#8c4bff);border-color:#9b6cff}.actions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:9px}.play,.cash{border:0;border-radius:13px;padding:15px;color:#fff;font-weight:1000}.play{background:linear-gradient(135deg,#6030bd,#9653ff)}.cash{background:linear-gradient(135deg,#d66b00,#ff9e14)}.play:disabled,.cash:disabled{filter:grayscale(.6);opacity:.5}.side{display:grid;gap:11px}.card{border:1px solid var(--line);border-radius:16px;background:#07111f;padding:11px}.card h3{margin:0 0 9px;font-size:10px;letter-spacing:.1em}.card h3 span{float:right;color:var(--green);font-size:9px}.players{max-height:470px;overflow:auto}.prow{display:grid;grid-template-columns:minmax(0,1fr) 55px 85px;gap:6px;padding:8px 0;border-bottom:1px solid #13283e;font-size:9px}.prow b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.win{color:var(--green)}.loss{color:var(--red)}.fly{color:var(--orange)}.hrow{display:grid;grid-template-columns:1fr auto auto;gap:7px;padding:8px 0;border-bottom:1px solid #13283e;font-size:9px}.hrow small{color:var(--muted)}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(100px);padding:10px 14px;border:1px solid #32506b;border-radius:12px;background:#07111fee;color:#fff;transition:.25s;z-index:20}.toast.show{transform:translateX(-50%) translateY(0)}.footer{display:flex;justify-content:space-between;gap:8px;margin-top:10px;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:#07111f;color:#9db0c2;font-size:9px}@media(max-width:900px){.top{grid-template-columns:1fr auto}.topstats{display:none}.grid{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.scene{height:420px}}@media(max-width:600px){.app{padding:7px}.brand{font-size:12px}.rocketmark{width:38px;height:38px}.scene{height:350px}.rocket{width:108px;height:160px;left:64%;top:28%}.mult{font-size:63px}.controls{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.side{grid-template-columns:1fr}.players{max-height:310px}.footer{font-size:8px;flex-wrap:wrap}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="rocketmark">🚀</div><div>ROCKET<br>CRASH <i>BEST</i></div></div><div class="topstats"><div class="stat"><small>Balance</small><b data-balance>1000.00 AZN</b></div><div class="stat"><small>Real Players</small><b class="online" data-real>1 REAL</b></div><div class="stat"><small>Round</small><b>#<span data-round>0</span></b></div></div><button class="deposit" data-deposit>+ Deposit</button></header><div class="recent"><span>Recent multipliers</span><div class="pills" data-pills></div></div><main class="grid"><section class="game"><div class="scene"><div class="stars"></div><div class="horizon"></div><div class="arc"></div><div class="round"><small>Round ID</small><b>#<span data-round2>0</span></b><small>Phase</small><b data-phase>BETTING</b><small>Bet closes</small><b data-clock>--</b></div><div class="multbox"><div class="phase" data-label>READY FOR LAUNCH</div><div class="mult" data-mult>1.00x</div></div><div class="rocket" data-rocket><svg viewBox="0 0 160 220"><defs><linearGradient id="b" x1="0" x2="1"><stop stop-color="#b6c8d8"/><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#778b9b"/></linearGradient><linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff7ad"/><stop offset=".25" stop-color="#ffad18"/><stop offset=".7" stop-color="#ff5b17"/><stop offset="1" stop-color="#8f1bff" stop-opacity=".25"/></linearGradient></defs><g transform="translate(20 8)"><path class="flame" d="M60 155c18 26 8 47 0 57-8-10-18-31 0-57Z" fill="url(#f)"/><path d="M60 8c29 27 40 65 34 115l-20 32H46l-20-32C20 73 31 35 60 8Z" fill="url(#b)" stroke="#81ddff" stroke-width="2"/><path d="M38 115 13 143l33-7M82 115l25 28-33-7" fill="#d84a59" stroke="#ff8290"/><circle cx="60" cy="62" r="14" fill="#0a1e32" stroke="#25d9ff" stroke-width="4"/><circle cx="60" cy="62" r="7" fill="#42b6ff"/><path d="M46 122h28v18H46z" fill="#b42038"/></g></svg></div></div><div class="controls"><div class="ctrl"><h3>STAKE</h3><div class="field"><input data-stake type="number" value="10" min="1" step="1"><span>AZN</span></div><div class="quick"><button data-q="5">5</button><button data-q="10" class="on">10</button><button data-q="20">20</button><button data-q="50">50</button><button data-q="100">100</button></div></div><div class="ctrl"><h3>AUTO PLAY</h3><div class="field"><input data-auto-rounds type="number" value="10" min="1"><span>ROUNDS</span></div><div class="quick"><button>5</button><button class="on">10</button><button>25</button><button>∞</button></div></div><div class="ctrl"><h3>AUTO CASHOUT</h3><div class="field"><input data-auto type="number" value="2.00" min="1.01" step=".01"><span>x</span></div><div class="quick"><button data-a="1.5">1.50x</button><button data-a="2" class="on">2.00x</button><button data-a="3">3.00x</button><button data-a="5">5.00x</button></div></div><div class="actions"><button class="play" data-play>BET / PLAY</button><button class="cash" data-cash disabled>CASH OUT <span data-cashx>1.00x</span></button></div></div></section><aside class="side"><section class="card"><h3>LIVE / REAL PLAYERS <span>● <b data-livecount>0</b></span></h3><div class="players" data-players></div></section><section class="card"><h3>ROUND HISTORY</h3><div data-history></div></section></aside></main><footer class="footer"><span>☰ &nbsp; 🔊 &nbsp; Game Rules</span><span>✓ Fairness / Math Profile</span><span>ⓘ How to Play</span></footer></div><div class="toast" data-toast></div><script src="math-core-v15.js?v=1.5.0"></script><script src="risk-engine-v15.js?v=1.5.0"></script><script src="core-v15.js?v=1.5.0"></script><script>
(()=>{'use strict';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let S=null,M=null,lastPhase='';const fmt=n=>(Number(n)||1).toFixed(2)+'x';function toast(t){const e=$('[data-toast]');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2400)}function playerRows(r){const all=[...(r?.simBets||[]),...Object.values(r?.realBets||{})];return all.slice(0,18).map(b=>`<div class="prow"><b>${b.source==='REAL'?'● ':''}${b.nickname||b.playerId}</b><span>${Number(b.stake||0).toFixed(0)}</span><strong class="${b.status==='LOST'||b.status==='UNPAID'?'loss':b.status==='OPEN'?'fly':'win'}">${b.status==='CASHED'&&b.cashout?fmt(b.cashout):b.status}</strong></div>`).join('')||'<div class="prow"><b>Waiting for round…</b></div>'}function render(s,m){S=s;M=m;const r=s.round||{};const mult=RocketCrashBest.currentMultiplier();$('[data-balance]').textContent=RocketCrashBest.wallet().toFixed(2)+' AZN';$('[data-real]').textContent=`${m.playerPeerCount||1} REAL`;$('[data-round]').textContent=r.id||0;$('[data-round2]').textContent=r.id||0;$('[data-phase]').textContent=r.phase||'WAITING';$('[data-mult]').textContent=fmt(mult);$('[data-cashx]').textContent=fmt(mult);$('[data-rocket]').classList.toggle('run',r.phase==='RUNNING');$('[data-label]').textContent=r.phase==='RUNNING'?'FLYING HIGH!':r.phase==='COUNTDOWN'?'IGNITION':r.phase==='SETTLED'?'FLIGHT ENDED':'READY FOR LAUNCH';let left='--';if(r.phase==='BETTING')left=Math.max(0,(r.bettingEnds-Date.now())/1000).toFixed(1)+'s';else if(r.phase==='COUNTDOWN')left=Math.max(0,(r.countdownEnds-Date.now())/1000).toFixed(1)+'s';$('[data-clock]').textContent=left;const me=RocketCrashBest.profile(),b=r.realBets?.[me.id];$('[data-play]').disabled=r.phase!=='BETTING'||!!b;$('[data-cash]').disabled=r.phase!=='RUNNING'||!b||b.status!=='OPEN';const hist=(s.history||[]).slice().reverse();$('[data-pills]').innerHTML=hist.slice(0,15).map(h=>`<span class="pill ${h.bust>=10?'hot':h.bust>=3?'high':h.bust>=1.5?'mid':''}">${fmt(h.bust)}</span>`).join('');$('[data-history]').innerHTML=hist.slice(0,10).map(h=>`<div class="hrow"><b>#${h.roundId}</b><strong class="${h.bust>=2?'win':''}">${fmt(h.bust)}</strong><small>${new Date(h.endedAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</small></div>`).join('')||'<small>No completed rounds yet</small>';$('[data-players]').innerHTML=playerRows(r);$('[data-livecount]').textContent=(r.simBets?.length||0)+Object.keys(r.realBets||{}).length;if(lastPhase&&lastPhase!=='SETTLED'&&r.phase==='SETTLED')toast(`Round #${r.id} ended at ${fmt(r.bust)}`);lastPhase=r.phase}RocketCrashBest.start({role:'player'}).subscribe(render);setInterval(()=>{if(S)render(S,RocketCrashBest.getMeta())},100);$('[data-play]').onclick=()=>{const res=RocketCrashBest.placeBet(Number($('[data-stake]').value),Number($('[data-auto]').value));if(!res.ok)toast('Bet rejected: '+(res.reason||'limit'));else toast(res.pending?'Bet request sent':'Bet accepted')};$('[data-cash]').onclick=()=>{const r=RocketCrashBest.cashout();if(r?.ok===false)toast('Cashout unavailable')};$('[data-deposit]').onclick=()=>{RocketCrashBest.setWallet(RocketCrashBest.wallet()+500);toast('+500 AZN demo balance')};$$('[data-q]').forEach(b=>b.onclick=()=>{$('[data-stake]').value=b.dataset.q;$$('[data-q]').forEach(x=>x.classList.toggle('on',x===b))});$$('[data-a]').forEach(b=>b.onclick=()=>{$('[data-auto]').value=b.dataset.a;$$('[data-a]').forEach(x=>x.classList.toggle('on',x===b))})})();
</script></body></html>
